<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人中心 · 百益商城</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main class="container" style="max-width:860px">
<div class="card mt16">
  <div class="row g16" style="flex-wrap:wrap">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--brand-tint);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700" id="avatar"></div>
    <div class="grow"><div class="row g8"><h2 id="nick"></h2><span class="tag tag-brand" id="level"></span></div>
      <div class="small muted mt8" id="phone"></div>
      <div class="small faint mt8">账号 ID <span id="uid"></span></div></div>
    <button class="btn" id="edit" style="align-self:flex-start"><i data-icon="pencil" data-size="15"></i>编辑资料</button>
  </div>
</div>
<div class="card mt12" style="padding:0">
  <a class="order-line" href="orders.html?status=PENDING_PAYMENT" style="align-items:center">
    <i data-icon="credit-card" data-size="18" style="color:var(--price)"></i><span class="grow">待付款</span>
    <span class="pill pill-pay" id="c-pay">0</span><i data-icon="chevron-right" data-size="16" style="color:var(--ink-3)"></i></a>
  <a class="order-line" href="orders.html?status=PENDING_SHIPMENT" style="align-items:center">
    <i data-icon="package" data-size="18" style="color:var(--warn)"></i><span class="grow">待发货</span>
    <span class="pill pill-ship" id="c-ship">0</span><i data-icon="chevron-right" data-size="16" style="color:var(--ink-3)"></i></a>
  <a class="order-line" href="orders.html?status=PENDING_RECEIPT" style="align-items:center">
    <i data-icon="truck" data-size="18" style="color:#2b5fbd"></i><span class="grow">待收货</span>
    <span class="pill pill-recv" id="c-recv">0</span><i data-icon="chevron-right" data-size="16" style="color:var(--ink-3)"></i></a>
  <a class="order-line" href="orders.html" style="align-items:center">
    <i data-icon="list-filter" data-size="18" style="color:var(--ink-2)"></i><span class="grow">全部订单</span>
    <i data-icon="chevron-right" data-size="16" style="color:var(--ink-3)"></i></a>
</div>
<div class="card mt12" style="padding:0">
  <a class="order-line" href="address.html" style="align-items:center"><i data-icon="map-pin" data-size="18" style="color:var(--brand)"></i><span class="grow">收货地址</span>
    <span class="small faint" id="addrCount"></span><i data-icon="chevron-right" data-size="16" style="color:var(--ink-3)"></i></a>
  <a class="order-line" href="seckill.html" style="align-items:center"><i data-icon="ticket-percent" data-size="18" style="color:var(--price)"></i><span class="grow">我的秒杀</span>
    <i data-icon="chevron-right" data-size="16" style="color:var(--ink-3)"></i></a>
  <a class="order-line" href="cart.html" style="align-items:center"><i data-icon="shopping-cart" data-size="18" style="color:var(--ink-2)"></i><span class="grow">购物车</span>
    <i data-icon="chevron-right" data-size="16" style="color:var(--ink-3)"></i></a>
</div>
<div class="card mt12 between" style="flex-wrap:wrap;gap:10px">
  <span class="small faint">前台页面已接入网关接口（/api/v1），小程序端复用同一套接口</span>
  <button class="btn" id="logout"><i data-icon="log-out" data-size="15"></i>退出登录</button>
</div>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
pageInit("category");

function countOf(status) {
  return Api.get("/v1/orders?status=" + status + "&page=1&size=1", { silent: true })
    .then(function (page) { return page.total || 0; }, function () { return 0; });
}

function load() {
  Api.profile().then(function (user) {
    document.getElementById("avatar").textContent = (user.nickname || user.username || "U").slice(0, 1).toUpperCase();
    document.getElementById("nick").textContent = user.nickname || user.username || "—";
    document.getElementById("level").textContent = "普通会员";
    document.getElementById("phone").textContent = user.phone || "未绑定手机号";
    document.getElementById("uid").textContent = user.id;
  }, showError);

  Promise.all([countOf("PENDING_PAYMENT"), countOf("PENDING_SHIPMENT"), countOf("PENDING_RECEIPT")]).then(function (counts) {
    document.getElementById("c-pay").textContent = counts[0];
    document.getElementById("c-ship").textContent = counts[1];
    document.getElementById("c-recv").textContent = counts[2];
  });

  Api.get("/v1/addresses", { silent: true }).then(function (list) {
    document.getElementById("addrCount").textContent = (list || []).length + " 个地址";
  }, function () { /* 地址拉取失败时不显示数量 */ });
}

document.getElementById("edit").onclick = function () {
  var current = window.Store.user() || {};
  openModal(
    "<div style=\"display:grid;gap:12px\">"
    + "<div class=\"field\"><label>昵称</label><input class=\"input\" id=\"f-nick\" value=\"" + esc(current.nickname || "") + "\" maxlength=\"50\" placeholder=\"请输入昵称\"></div>"
    + "<div class=\"field\"><label>手机号</label><input class=\"input\" id=\"f-phone\" value=\"\" placeholder=\"11 位手机号，留空表示解绑\">"
    + "<div class=\"hint\">当前：" + esc(current.phone || "未绑定") + "；列表返回的是脱敏号码，需要重新输入完整手机号</div></div>"
    + "<div class=\"field\"><label>账号</label><input class=\"input\" value=\"" + esc(current.username || "") + "\" disabled>"
    + "<div class=\"hint\">登录账号不可修改</div></div></div>",
    { title: "编辑资料", footer: "<button class=\"btn\" data-close>取消</button><button class=\"btn btn-primary\" id=\"ok\">保存</button>" });
  document.getElementById("ok").onclick = function () {
    var nickname = document.getElementById("f-nick").value.trim();
    var phone = document.getElementById("f-phone").value.trim();
    if (!nickname) { toast("请填写昵称", "err"); return; }
    if (phone && !/^1[3-9]\d{9}$/.test(phone)) { toast("请填写完整正确的手机号", "err"); return; }
    var body = { nickname: nickname };
    // 手机号留空 = 解绑；没填过就不动
    if (phone || (current.phone && phone === "")) body.phone = phone;
    Api.put("/v1/users/me", body).then(function (profile) {
      closeModal();
      toast("资料已保存", "ok");
      window.Store.refreshUser().then(load);
    }, showError);
  };
};
document.getElementById("logout").onclick = function () {
  Api.logout().then(function () {
    toast("已退出登录", "ok");
    setTimeout(function () { location.href = "index.html"; }, 600);
  });
};

if (requireLogin()) load();
</script>
</body>
</html>
