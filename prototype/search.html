<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>搜索 · 百益商城</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main class="container">
<div class="crumb"><a href="index.html">首页</a><i data-icon="chevron-right" data-size="13"></i><span>搜索结果</span></div>
<div class="split" style="margin-top:14px">
  <aside class="card card-flush">
    <div class="card-head"><h3 style="font-size:15px;display:flex;align-items:center;gap:6px"><i data-icon="list-filter" data-size="15"></i>筛选条件</h3><button class="btn btn-ghost btn-sm" id="reset">重置</button></div>
    <div id="filters"></div>
  </aside>
  <section>
    <div class="card card-tight between" style="flex-wrap:wrap;gap:10px">
      <div class="segmented" id="sortSeg">
        <button data-value="composite" class="on">综合</button>
        <button data-value="sales">销量</button>
        <button data-value="price_asc">价格升</button>
        <button data-value="price_desc">价格降</button>
      </div>
      <span class="small faint" id="count"></span>
    </div>
    <div id="keywordBar" class="alert mt12" style="display:none"></div>
    <div class="grid-products" id="grid" style="margin-top:14px"></div>
    <div class="pagination" id="pager"></div>
  </section>
</div>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/ui.js"></script>
<script>
pageInit("category");
var kw = qs("keyword", ""), fCat = Number(qs("categoryId", 0)), fBrand = 0, fPrice = "", sort = "composite", page = 1, PAGE = 8;
var brands = [];

/* 价格区间按「分」传递（后端金额单位） */
var priceRanges = [
  { k: "", t: "不限" }, { k: "0-10000", t: "100 元以下" },
  { k: "10000-30000", t: "100-300 元" }, { k: "30000-100000", t: "300-1000 元" },
  { k: "100000-", t: "1000 元以上" }
];

function renderFilters() {
  var l1s = catTree();
  var curL1 = null;
  if (fCat) { var chain = catPath(fCat); curL1 = chain.length ? chain[0].id : null; }
  var l2s = curL1 ? (catTree().filter(function (x) { return x.id === curL1; })[0] || {}).children || [] : [];
  var brandChips = brands.map(function (b) {
    return "<button data-brand=\"" + b.id + "\" class=\"" + (fBrand === b.id ? "on" : "") + "\">" + esc(b.name) + "</button>";
  }).join("");
  var box = document.getElementById("filters");
  box.innerHTML =
    "<div class=\"filter-group\"><h4>一级分类</h4><div class=\"filter-opts\">"
      + "<button data-cat=\"0\" class=\"" + (fCat === 0 ? "on" : "") + "\">不限</button>"
      + l1s.map(function (c) { return "<button data-cat=\"" + c.id + "\" class=\"" + (curL1 === c.id ? "on" : "") + "\">" + esc(c.name) + "</button>"; }).join("")
    + "</div></div>"
    + (l2s.length
        ? "<div class=\"filter-group\"><h4>二级分类</h4><div class=\"filter-opts\">"
          + l2s.map(function (c) { return "<button data-cat=\"" + c.id + "\" class=\"" + (fCat === c.id ? "on" : "") + "\">" + esc(c.name) + "</button>"; }).join("")
          + "</div></div>"
        : "")
    + "<div class=\"filter-group\"><h4>品牌</h4><div class=\"filter-opts\">"
      + "<button data-brand=\"0\" class=\"" + (fBrand === 0 ? "on" : "") + "\">不限</button>" + brandChips
    + "</div></div>"
    + "<div class=\"filter-group\"><h4>价格区间</h4><div class=\"filter-opts\">"
      + priceRanges.map(function (r) { return "<button data-price=\"" + r.k + "\" class=\"" + (fPrice === r.k ? "on" : "") + "\">" + r.t + "</button>"; }).join("")
    + "</div></div>";
  box.querySelectorAll("[data-cat]").forEach(function (b) { b.onclick = function () { fCat = Number(b.dataset.cat); page = 1; render(); }; });
  box.querySelectorAll("[data-brand]").forEach(function (b) { b.onclick = function () { fBrand = Number(b.dataset.brand); page = 1; render(); }; });
  box.querySelectorAll("[data-price]").forEach(function (b) { b.onclick = function () { fPrice = b.dataset.price; page = 1; render(); }; });
  mountIcons(box);
}

/** 组装查询串（金额已是分；排序与分页交给后端，综合排序由后端打分） */
function queryString() {
  var parts = ["size=" + PAGE, "page=" + page, "sort=" + sort];
  if (kw) parts.push("keyword=" + encodeURIComponent(kw));
  if (fCat) parts.push("categoryId=" + fCat);
  if (fBrand) parts.push("brandId=" + fBrand);
  if (fPrice) {
    var seg = fPrice.split("-");
    if (seg[0]) parts.push("minPrice=" + seg[0]);
    if (seg[1]) parts.push("maxPrice=" + seg[1]);
  }
  return parts.join("&");
}

function render() {
  renderFilters();
  return Api.get("/v1/search/products?" + queryString()).then(function (data) {
    var list = (data && data.list) || [];
    var total = (data && data.total) || 0;
    var bar = document.getElementById("keywordBar");
    if (kw) {
      bar.style.display = "flex";
      bar.innerHTML = "<i data-icon=\"search\" data-size=\"15\"></i><span>关键词「" + esc(kw) + "」共找到 <b>" + total + "</b> 件商品</span>";
    } else { bar.style.display = "none"; }
    document.getElementById("count").textContent = "共 " + total + " 件商品";
    mountGrid("#grid", list);
    renderPager(total);
    mountIcons(document);
  }).catch(showError);
}

function renderPager(total) {
  var pages = Math.max(1, Math.ceil(total / PAGE)), el = document.getElementById("pager");
  if (pages <= 1) { el.innerHTML = ""; return; }
  var html = "";
  for (var i = 1; i <= pages; i++) html += "<button class=\"" + (i === page ? "on" : "") + "\" data-p=\"" + i + "\">" + i + "</button>";
  el.innerHTML = html;
  el.querySelectorAll("[data-p]").forEach(function (b) { b.onclick = function () { page = Number(b.dataset.p); render(); }; });
}

bindTabs("#sortSeg", function (v) { sort = v; page = 1; render(); });
document.getElementById("reset").onclick = function () { fCat = 0; fBrand = 0; fPrice = ""; page = 1; render(); toast("已重置筛选条件"); };

Promise.all([Store.categories(), Api.get("/v1/brands").catch(function () { return []; })]).then(function (res) {
  brands = res[1] || [];
  render();
}).catch(showError);
</script>
</body>
</html>
