<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>收货地址 · 百益商城</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main class="container" style="max-width:860px">
<div class="crumb"><a href="profile.html">个人中心</a><i data-icon="chevron-right" data-size="13"></i><span>收货地址</span></div>
<div class="card mt12">
  <div class="between"><h3 style="font-size:16px">我的收货地址</h3>
    <button class="btn btn-primary btn-sm" id="add"><i data-icon="plus" data-size="14"></i>新增地址</button></div>
  <div class="mt16" id="list" style="display:grid;gap:10px"></div>
</div>
<div class="alert alert-plain mt12"><i data-icon="info" data-size="15"></i>下单时会保存地址快照，之后修改或删除地址都不影响已生成的订单。</div>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
pageInit("category");

var addresses = [];

function render() {
  var box = document.getElementById("list");
  if (!addresses.length) {
    box.innerHTML = "<div class=\"empty\"><i data-icon=\"map-pin\" data-size=\"36\"></i><h4>还没有收货地址</h4><p class=\"small\">添加一个地址，下单更方便</p></div>";
    mountIcons(box);
    return;
  }
  box.innerHTML = addresses.map(function (a) {
    return "<div class=\"card\" style=\"padding:14px\"><div class=\"between\" style=\"flex-wrap:wrap;gap:10px\">"
      + "<div><div class=\"row g8\"><span class=\"strong\">" + esc(a.receiverName) + "</span><span class=\"muted small\">" + esc(a.receiverPhone) + "</span>"
      + (a.isDefault ? "<span class=\"tag tag-brand\">默认</span>" : "") + "</div>"
      + "<div class=\"small muted mt8\">" + esc(a.province + a.city + a.district + " " + a.detail) + "</div></div>"
      + "<div class=\"row g6\">"
      + (a.isDefault ? "" : "<button class=\"btn btn-sm\" data-def=\"" + a.id + "\">设为默认</button>")
      + "<button class=\"btn btn-sm\" data-edit=\"" + a.id + "\"><i data-icon=\"pencil\" data-size=\"14\"></i>编辑</button>"
      + "<button class=\"btn btn-sm\" data-del=\"" + a.id + "\"><i data-icon=\"trash-2\" data-size=\"14\"></i>删除</button></div></div></div>";
  }).join("");
  mountIcons(box);

  box.querySelectorAll("[data-def]").forEach(function (b) {
    b.onclick = function () {
      Api.put("/v1/addresses/" + b.dataset.def + "/default").then(function () { toast("已设为默认地址", "ok"); load(); }, showError);
    };
  });
  box.querySelectorAll("[data-edit]").forEach(function (b) {
    b.onclick = function () { form(addresses.filter(function (a) { return a.id === Number(b.dataset.edit); })[0]); };
  });
  box.querySelectorAll("[data-del]").forEach(function (b) {
    b.onclick = function () {
      var id = Number(b.dataset.del);
      openModal("<p>确定删除该收货地址？</p>", { title: "删除地址",
        footer: "<button class=\"btn\" data-close>取消</button><button class=\"btn btn-price\" id=\"ok\">删除</button>" });
      document.getElementById("ok").onclick = function () {
        closeModal();
        Api.del("/v1/addresses/" + id).then(function () { toast("已删除", "ok"); load(); }, showError);
      };
    };
  });
}

function form(address) {
  var a = address || { id: 0, receiverName: "", receiverPhone: "", province: "", city: "", district: "", detail: "", isDefault: false };
  openModal(
    "<div style=\"display:grid;gap:12px\">"
    + "<div class=\"field\"><label>收货人</label><input class=\"input\" id=\"f-name\" value=\"" + esc(a.receiverName) + "\" placeholder=\"请输入收货人姓名\"></div>"
    + "<div class=\"field\"><label>手机号</label><input class=\"input\" id=\"f-phone\" value=\"" + esc(a.receiverPhone) + "\" placeholder=\"11 位手机号\">"
    + (String(a.receiverPhone).indexOf("*") >= 0 ? "<div class=\"hint\">为保护隐私列表返回的是脱敏号码，保存前请重新输入完整手机号</div>" : "") + "</div>"
    + "<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px\">"
    + "<div class=\"field\"><label>省</label><input class=\"input\" id=\"f-prov\" value=\"" + esc(a.province) + "\" placeholder=\"如 广东省\"></div>"
    + "<div class=\"field\"><label>市</label><input class=\"input\" id=\"f-city\" value=\"" + esc(a.city) + "\" placeholder=\"如 深圳市\"></div>"
    + "<div class=\"field\"><label>区 / 县</label><input class=\"input\" id=\"f-dist\" value=\"" + esc(a.district) + "\" placeholder=\"如 南山区\"></div></div>"
    + "<div class=\"field\"><label>详细地址</label><input class=\"input\" id=\"f-detail\" value=\"" + esc(a.detail) + "\" placeholder=\"街道、门牌号\"></div>"
    + "<label class=\"check\"><input type=\"checkbox\" id=\"f-def\" " + (a.isDefault ? "checked" : "") + "><span>设为默认地址</span></label></div>",
    { title: a.id ? "编辑地址" : "新增地址",
      footer: "<button class=\"btn\" data-close>取消</button><button class=\"btn btn-primary\" id=\"ok\">保存</button>" });
  document.getElementById("ok").onclick = function () {
    var payload = {
      receiverName: document.getElementById("f-name").value.trim(),
      receiverPhone: document.getElementById("f-phone").value.trim(),
      province: document.getElementById("f-prov").value.trim(),
      city: document.getElementById("f-city").value.trim(),
      district: document.getElementById("f-dist").value.trim(),
      detail: document.getElementById("f-detail").value.trim(),
      isDefault: document.getElementById("f-def").checked
    };
    if (!payload.receiverName) { toast("请填写收货人", "err"); return; }
    if (!/^1[3-9]\d{9}$/.test(payload.receiverPhone)) { toast("请填写完整正确的手机号", "err"); return; }
    if (!payload.province || !payload.city || !payload.district) { toast("请填写完整的省 / 市 / 区", "err"); return; }
    if (!payload.detail) { toast("请填写详细地址", "err"); return; }
    var request = a.id ? Api.put("/v1/addresses/" + a.id, payload) : Api.post("/v1/addresses", payload);
    request.then(function () { closeModal(); toast("地址已保存", "ok"); load(); }, showError);
  };
}

function load() {
  Api.get("/v1/addresses").then(function (list) {
    addresses = list || [];
    render();
  }, showError);
}

document.getElementById("add").onclick = function () { form(null); };

if (requireLogin()) load(); else render();
</script>
</body>
</html>
