<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>秒杀专区 · 百益商城</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main class="container">
<div class="crumb"><a href="index.html">首页</a><i data-icon="chevron-right" data-size="13"></i><span>秒杀专区</span></div>
<div class="mt12" style="border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)">
  <div class="flash-head">
    <h3><i data-icon="zap" data-size="19"></i>限时秒杀</h3>
    <div class="flash-sessions" id="sessions"></div>
    <div style="margin-left:auto;text-align:right">
      <div class="small" style="opacity:.75" id="cdLabel"></div>
      <div class="countdown mt8" id="cd"></div>
    </div>
  </div>
  <div style="padding:14px;background:var(--surface)"><div id="items" style="display:grid;gap:12px"></div></div>
</div>
<div class="alert alert-plain mt16"><i data-icon="info" data-size="15"></i>秒杀库存独立划拨自普通库存；下单后 15 分钟未支付将自动取消并回补秒杀库存。每人限购数量由后台配置。</div>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
pageInit("seckill");

var activities = [];
var curId = Number(qs("activity", 0)) || 0;
var detail = null;
var timer = null;
var grabbing = false;

function statusLabel(status) {
  return { RUNNING: "抢购中", NOT_STARTED: "即将开始", ENDED: "已结束" }[status] || status;
}

function renderSessions() {
  var box = document.getElementById("sessions");
  box.innerHTML = activities.map(function (a) {
    return "<button data-s=\"" + a.id + "\" class=\"" + (a.id === curId ? "on" : "") + "\">" + esc(a.name) + " " + statusLabel(a.status) + "</button>";
  }).join("");
  box.querySelectorAll("[data-s]").forEach(function (b) {
    b.onclick = function () { select(Number(b.dataset.s)); };
  });
}

function render() {
  renderSessions();
  if (timer) { clearInterval(timer); timer = null; }
  if (!detail) {
    document.getElementById("items").innerHTML = "<div class=\"empty\"><i data-icon=\"loader-circle\" data-size=\"34\"></i><h4>正在加载秒杀场次…</h4></div>";
    mountIcons(document.getElementById("items"));
    return;
  }
  var status = detail.status;
  var label = document.getElementById("cdLabel");
  var cd = document.getElementById("cd");
  if (status === "ENDED") {
    label.textContent = "本场已结束";
    cd.innerHTML = "<b>00</b>:<b>00</b>:<b>00</b>";
  } else {
    var target = status === "NOT_STARTED" ? detail.startTime : detail.endTime;
    label.textContent = status === "NOT_STARTED" ? "距开始" : "距结束";
    timer = countdown(cd, target, function () { refresh(); });
  }

  var box = document.getElementById("items");
  var skus = detail.skus || [];
  if (!skus.length) {
    box.innerHTML = emptyHTML("本场暂无秒杀商品", "看看其他场次吧");
    mountIcons(box);
    return;
  }
  box.innerHTML = skus.map(function (sku) {
    var soldOut = (sku.remaining || 0) <= 0;
    var disabled = soldOut || status !== "RUNNING";
    var sold = Math.max(0, (sku.allocStock || 0) - (sku.remaining || 0));
    var pct = sku.allocStock ? Math.round(sold / sku.allocStock * 100) : 0;
    var btnText = soldOut ? "已售罄" : status === "ENDED" ? "已结束" : status === "NOT_STARTED" ? "即将开始" : "立即抢购";
    return "<div class=\"flash-item\"><img src=\"" + img(sku.image, "headphone-01") + "\" alt=\"" + esc(sku.productName) + "\">"
      + "<div class=\"grow\" style=\"min-width:0\">"
      + "<a href=\"product.html?id=" + sku.productId + "\" class=\"clamp2 strong\">" + esc(sku.productName) + "</a>"
      + "<div class=\"row g8 mt8\" style=\"flex-wrap:wrap\"><span class=\"price\" style=\"font-size:18px\">" + yuan(sku.seckillPrice) + "</span>"
      + "<span class=\"price-origin small\">" + yuanPlain(sku.originalPrice) + "</span>"
      + "<span class=\"tag\">每人限购 " + (sku.limitPerUser || 1) + " 件</span></div>"
      + "<div class=\"row g8 mt12\" style=\"max-width:320px\"><div class=\"progress grow\"><i style=\"width:" + pct + "%\"></i></div>"
      + "<span class=\"small faint nowrap\">已抢 " + pct + "%</span></div></div>"
      + "<div style=\"align-self:center;text-align:center;min-width:104px\">"
      + "<div class=\"small faint mb8\">剩余 " + Math.max(0, sku.remaining || 0) + " 件</div>"
      + "<button class=\"btn " + (disabled ? "" : "btn-price") + "\" data-buy=\"" + sku.id + "\" " + (disabled || grabbing ? "disabled" : "") + ">" + btnText + "</button></div></div>";
  }).join("");
  mountIcons(box);
  box.querySelectorAll("[data-buy]").forEach(function (b) {
    b.onclick = function () { grab(Number(b.dataset.buy)); };
  });
}

function select(id) {
  curId = id;
  detail = null;
  render();
  refresh();
}

function refresh() {
  if (!curId) return;
  return Api.get("/v1/seckill/activities/" + curId).then(function (data) {
    detail = data;
    render();
  }, function (error) {
    if (!detail) showError(error);
  });
}

/** 抢购：Redis 预扣 → 返回排队票据 → 轮询结果（REQ-903 / REQ-904） */
function grab(activitySkuId) {
  if (!requireLogin()) return;
  if (grabbing) return;
  grabbing = true;
  render();
  var requestId = Api.uuid();
  openModal("<div class=\"center\" style=\"flex-direction:column;gap:10px;padding:8px 0\">"
    + "<i data-icon=\"loader-circle\" data-size=\"34\" style=\"color:var(--brand)\"></i>"
    + "<div class=\"strong\">排队中…</div>"
    + "<div class=\"small faint\">请求已提交，正在为你锁定库存</div></div>", { title: "秒杀下单" });
  Api.post("/v1/seckill/activities/skus/" + activitySkuId + "/orders",
    { quantity: 1, requestId: requestId }, { requestId: requestId }).then(function (ticket) {
    return poll(ticket.ticketId, 0);
  }).then(function (result) {
    grabbing = false;
    showResult(result);
  }, function (error) {
    grabbing = false;
    closeModal();
    render();
    showError(error);
  });
}

/** 轮询票据：最多约 15 秒，仍未出结果就提示稍后到订单页查看 */
function poll(ticketId, attempt) {
  return Api.get("/v1/seckill/results/" + encodeURIComponent(ticketId)).then(function (result) {
    if (result.status === "SUCCESS" || result.status === "FAILED") return result;
    if (attempt >= 20) return { ticketId: ticketId, status: "TIMEOUT", message: "抢购排队中，可稍后到「我的订单」查看结果" };
    return new Promise(function (resolve) {
      setTimeout(function () { resolve(poll(ticketId, attempt + 1)); }, 700);
    });
  });
}

function showResult(result) {
  closeModal();
  grabbing = false;
  var ok = result.status === "SUCCESS";
  var skipped = result.status === "TIMEOUT";
  render();
  openModal("<div class=\"center\" style=\"flex-direction:column;gap:10px;padding:8px 0\">"
    + "<i data-icon=\"" + (ok ? "circle-check" : skipped ? "loader-circle" : "circle-x") + "\" data-size=\"34\" style=\"color:" + (ok ? "var(--brand)" : "var(--price)") + "\"></i>"
    + "<div class=\"strong\">" + (ok ? "抢购成功" : skipped ? "仍在排队" : esc(Store.failMessage(result.failReason, result.message))) + "</div>"
    + (ok ? "<div class=\"small faint\">订单号 " + esc(result.orderNo) + " · 请在 15 分钟内完成支付</div>"
        : "<div class=\"small faint\">" + esc(result.message || "可以看看其他场次") + "</div>") + "</div>",
    { title: "抢购结果", footer: ok
        ? "<button class=\"btn\" data-close>稍后支付</button><a class=\"btn btn-price\" href=\"pay.html?no=" + encodeURIComponent(result.orderNo) + "\">立即支付</a>"
        : "<button class=\"btn\" data-close>知道了</button>" });
  mountIcons(document.querySelector(".mask"));
  if (ok) {
    window.Store.refreshCartCount();
    refresh();   // 抢成功后刷新剩余量与进度
  }
}

function boot() {
  Api.get("/v1/seckill/activities?limit=10").then(function (list) {
    activities = list || [];
    if (!activities.length) {
      document.getElementById("items").innerHTML = emptyHTML("暂无秒杀活动", "等运营配置后再来看看");
      mountIcons(document.getElementById("items"));
      return;
    }
    var running = activities.filter(function (a) { return a.status === "RUNNING"; })[0];
    select(curId && activities.some(function (a) { return a.id === curId; }) ? curId : (running || activities[0]).id);
  }, showError);
}

boot();
</script>
</body>
</html>
