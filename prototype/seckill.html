<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>秒杀专区 · 百益商城</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main class="container">
<div class="crumb"><a href="index.html">首页</a><i data-icon="chevron-right" data-size="13"></i><span>秒杀专区</span></div>
<div class="mt12" style="border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)">
  <div class="flash-head">
    <h3><i data-icon="zap" data-size="19"></i>限时秒杀</h3>
    <div class="flash-sessions" id="sessions"></div>
    <div style="margin-left:auto;text-align:right">
      <div class="small" style="opacity:.75" id="cdLabel"></div>
      <div class="countdown mt8" id="cd"></div>
    </div>
  </div>
  <div style="padding:14px;background:var(--surface)"><div id="items" style="display:grid;gap:12px"></div></div>
</div>
<div class="alert alert-plain mt16"><i data-icon="info" data-size="15"></i>秒杀库存独立划拨自普通库存；下单后 15 分钟未支付将自动取消并回补秒杀库存。每人限购数量由后台配置。</div>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
pageInit("seckill");
var sessions = DB.seckill.sessions;
var running = sessions.filter(function (s) { return s.status === "RUNNING"; })[0] || sessions[0];
var curId = running.id, timer = null;

function label(s) {
  return { RUNNING: "抢购中", NOT_STARTED: "即将开始", ENDED: "已结束" }[s.status];
}
function renderSessions() {
  document.getElementById("sessions").innerHTML = sessions.map(function (s) {
    return "<button data-s=\"" + s.id + "\" class=\"" + (s.id === curId ? "on" : "") + "\">" + s.name + " " + label(s) + "</button>";
  }).join("");
  document.querySelectorAll("[data-s]").forEach(function (b) {
    b.onclick = function () { curId = Number(b.dataset.s); render(); };
  });
}
function render() {
  var s = sessions.filter(function (x) { return x.id === curId; })[0];
  renderSessions();
  if (timer) clearInterval(timer);
  var target = s.status === "NOT_STARTED" ? s.startTime : s.endTime;
  document.getElementById("cdLabel").textContent = s.status === "NOT_STARTED" ? "距开始" : s.status === "RUNNING" ? "距结束" : "本场已结束";
  if (s.status === "ENDED") document.getElementById("cd").innerHTML = "<b>00</b>:<b>00</b>:<b>00</b>";
  else timer = countdown(document.getElementById("cd"), target, render);

  var list = DB.seckill.items.filter(function (i) { return i.sessionId === curId; });
  var box = document.getElementById("items");
  if (!list.length) {
    box.innerHTML = emptyHTML("本场暂无秒杀商品", "看看其他场次吧");
    mountIcons(box); return;
  }
  box.innerHTML = list.map(function (it) {
    var p = P(it.productId);
    var soldOut = it.sold >= it.total;
    var notStarted = s.status === "NOT_STARTED", ended = s.status === "ENDED";
    var pct = Math.round(it.sold / it.total * 100);
    var btnText = soldOut ? "已售罄" : ended ? "已结束" : notStarted ? "即将开始" : "立即抢购";
    var disabled = soldOut || ended || notStarted;
    return "<div class=\"flash-item\"><img src=\"" + img(p.image) + "\" alt=\"" + p.name + "\">"
      + "<div class=\"grow\" style=\"min-width:0\">"
      + "<a href=\"product.html?id=" + p.id + "\" class=\"clamp2 strong\">" + p.name + "</a>"
      + "<div class=\"row g8 mt8\" style=\"flex-wrap:wrap\"><span class=\"price\" style=\"font-size:18px\">" + yuan(it.seckillPrice) + "</span>"
      + "<span class=\"price-origin small\">" + yuanPlain(it.originPrice) + "</span>"
      + "<span class=\"tag\">每人限购 " + it.limitPerUser + " 件</span></div>"
      + "<div class=\"row g8 mt12\" style=\"max-width:320px\"><div class=\"progress grow\"><i style=\"width:" + pct + "%\"></i></div>"
      + "<span class=\"small faint nowrap\">已抢 " + pct + "%</span></div></div>"
      + "<div style=\"align-self:center;text-align:center;min-width:104px\">"
      + "<div class=\"small faint mb8\">剩余 " + Math.max(0, it.total - it.sold) + " 件</div>"
      + "<button class=\"btn " + (disabled ? "" : "btn-price") + "\" data-buy=\"" + it.id + "\" " + (disabled ? "disabled" : "") + ">" + btnText + "</button></div></div>";
  }).join("");
  mountIcons(box);
  box.querySelectorAll("[data-buy]").forEach(function (b) { b.onclick = function () { grab(Number(b.dataset.buy)); }; });
}

/* 抢购：Redis 预扣 → 返回排队中 → 轮询结果（对应 REQ-903 / REQ-904） */
function grab(itemId) {
  var it = DB.seckill.items.filter(function (x) { return x.id === itemId; })[0];
  var p = P(it.productId);
  var ticket = genTicketId();
  openModal("<div class=\"center\" style=\"flex-direction:column;gap:10px;padding:8px 0\">"
    + "<i data-icon=\"loader-circle\" data-size=\"34\" style=\"color:var(--brand)\"></i>"
    + "<div class=\"strong\">排队中…</div>"
    + "<div class=\"small faint\">请求已提交，正在为你锁定库存</div>"
    + "<div class=\"small faint\">票据号 " + ticket + "</div></div>", { title: "秒杀下单" });
  setTimeout(function () {
    if (it.sold >= it.total) { showResult(false, p, it, "已售罄"); return; }
    it.sold += 1;
    var no = genOrderNo();
    sessionStorage.setItem("baiyi_pending", JSON.stringify({ orderNo: no, payAmount: it.seckillPrice, source: "SECKILL",
      items: [{ productId: p.id, quantity: 1 }], timeoutAt: new Date(Date.now() + 900000).toISOString() }));
    showResult(true, p, it, "", no);
    render();
  }, 1500);
}
function showResult(ok, p, it, reason, no) {
  closeModal();
  openModal("<div class=\"center\" style=\"flex-direction:column;gap:10px;padding:8px 0\">"
    + "<i data-icon=\"" + (ok ? "circle-check" : "circle-x") + "\" data-size=\"34\" style=\"color:" + (ok ? "var(--brand)" : "var(--price)") + "\"></i>"
    + "<div class=\"strong\">" + (ok ? "抢购成功" : reason) + "</div>"
    + "<div class=\"small faint\">" + (ok ? p.name : "很遗憾，本次没有抢到") + "</div>"
    + (ok ? "<div class=\"small faint\">订单号 " + no + " · 请在 15 分钟内完成支付</div>" : "<div class=\"small faint\">可以看看其他场次</div>") + "</div>",
    { title: "抢购结果", footer: ok
        ? "<button class=\"btn\" data-close>稍后支付</button><a class=\"btn btn-price\" href=\"pay.html\">立即支付</a>"
        : "<button class=\"btn\" data-close>知道了</button>" });
  mountIcons(document.querySelector(".mask"));
}
render();
</script>
</body>
</html>
