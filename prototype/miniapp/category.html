<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分类 · 百益商城小程序</title>
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="assets/mini.css">
</head>
<body>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="assets/mini-shell.js"></script>
<script>
var body = miniShell({ tab: "category", title: "商品分类" });
var cur = 12;
function render() {
  var tree = catTree();
  var side = tree.map(function (c) {
    var on = c.id === cur ? "on" : "";
    return "<button data-c=\"" + c.id + "\" class=\"" + on + "\">" + c.name + "</button>";
  }).join("");
  var node = tree.filter(function (c) { return c.id === cur; })[0];
  function tile(x) {
    var first = categoryProducts(x.id, "sales")[0];
    return "<a href=\"category.html?id=" + x.id + "\"><span class=\"ph\">"
      + (first ? "<img src=\"" + img(first.image) + "\" alt=\"\">" : "")
      + "</span>" + x.name + "</a>";
  }
  var main = node.children.map(function (l2) {
    var prods = categoryProducts(l2.id, "sales").slice(0, 2);
    function card(p) {
      return "<a class=\"m-card\" href=\"product.html?id=" + p.id + "\"><div class=\"ph\"><img src=\"" + img(p.image) + "\" alt=\"\"></div>"
        + "<div class=\"in\"><div class=\"nm\">" + p.name + "</div><div class=\"pr\">" + yuanPlain(p.price) + "</div></div></a>";
    }
    return "<h4>" + l2.name + "</h4><div class=\"grid3\">" + l2.children.map(tile).join("") + "</div>"
      + (prods.length ? "<div class=\"m-grid\" style=\"margin-bottom:14px\">" + prods.map(card).join("") + "</div>" : "");
  }).join("");
  body.innerHTML = "<div class=\"m-cats\"><div class=\"side\">" + side + "</div><div class=\"main\">" + main + "</div></div>";
  body.querySelectorAll("[data-c]").forEach(function (b) {
    b.onclick = function () { cur = Number(b.dataset.c); render(); };
  });
  mountMiniIcons(body);
}
render();
</script>
</body>
</html>
