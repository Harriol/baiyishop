<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的 · 百益商城小程序</title>
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="assets/mini.css">
</head>
<body>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="assets/mini-shell.js"></script>
<script>
var body = miniShell({ tab: "profile", title: "我的" });
var user = null;
var counts = { PENDING_PAYMENT: 0, PENDING_SHIPMENT: 0, PENDING_RECEIPT: 0, COMPLETED: 0 };
var addressCount = 0;

/* 小程序端登录方式为微信授权：本地联调走后端 MockWechatAuthClient（code 即 openid） */
var DEMO_CODE = "miniapp-demo-user";

function render() {
  var logged = !!user;
  var name = logged ? (user.nickname || user.username) : "未登录";
  var sub = logged ? ("微信授权登录 · " + (user.phone || "未绑定手机号")) : "点击下方按钮完成微信授权登录";
  body.innerHTML =
    "<div style=\"background:linear-gradient(135deg,#0f7b6c,#12a08c);padding:18px 16px 26px;color:#fff\">"
    + "<div class=\"row g12\">"
    + "<div style=\"width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700\">" + esc(name.slice(0, 1).toUpperCase()) + "</div>"
    + "<div><div style=\"font-size:17px;font-weight:600\">" + esc(name) + "</div>"
    + "<div style=\"font-size:12px;opacity:.85;margin-top:2px\">" + esc(sub) + "</div></div>"
    + "<span class=\"m-tag\" style=\"margin-left:auto;background:rgba(255,255,255,.2);color:#fff\">" + (logged ? "普通会员" : "游客") + "</span></div></div>"
    + "<div style=\"background:var(--surface);border-radius:12px;margin:-14px 12px 0;position:relative;padding:12px 6px\">"
    + "<div class=\"row\" style=\"padding:0 6px 10px\"><span class=\"small\" style=\"font-weight:600\">我的订单</span>"
    + "<a class=\"small faint\" style=\"margin-left:auto\" href=\"orders.html\">全部订单 ></a></div>"
    + "<div style=\"display:grid;grid-template-columns:repeat(4,1fr);text-align:center\">"
    + [["PENDING_PAYMENT", "待付款", "credit-card"], ["PENDING_SHIPMENT", "待发货", "package"], ["PENDING_RECEIPT", "待收货", "truck"], ["COMPLETED", "已完成", "circle-check"]].map(function (t) {
        return "<a href=\"orders.html?status=" + t[0] + "\" style=\"position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)\">"
          + "<i data-icon=\"" + t[2] + "\" data-size=\"21\" style=\"color:var(--brand)\"></i>" + t[1]
          + (counts[t[0]] ? "<span style=\"position:absolute;top:-4px;right:14px;min-width:15px;height:15px;border-radius:8px;background:var(--price);color:#fff;font-size:10px;line-height:15px\">" + counts[t[0]] + "</span>" : "")
          + "</a>";
      }).join("") + "</div></div>"
    + "<div class=\"m-list\" style=\"margin:12px\">"
    + [["map-pin", "收货地址", "../address.html", addressCount + " 个"],
       ["ticket-percent", "我的秒杀", "../seckill.html", ""],
       ["shopping-cart", "购物车", "cart.html", ""],
       ["store", "前台商城（Web）", "../index.html", ""]].map(function (m) {
        return "<a class=\"m-row\" href=\"" + m[2] + "\"><i data-icon=\"" + m[0] + "\" data-size=\"18\" style=\"color:var(--brand)\"></i>"
          + "<span class=\"grow small\">" + m[1] + "</span><span class=\"small faint\">" + m[3] + "</span>"
          + "<i data-icon=\"chevron-right\" data-size=\"15\" style=\"color:var(--ink-3)\"></i></a>";
      }).join("") + "</div>"
    + (logged
        ? "<div style=\"padding:0 12px 16px\"><button class=\"m-btn plain full\" id=\"out\">退出登录</button></div>"
        : "<div style=\"padding:0 12px 16px\"><button class=\"m-btn price full\" id=\"login\">微信授权登录</button></div>")
    + "<div class=\"small faint\" style=\"text-align:center;padding-bottom:16px\">小程序端与 Web 端共用同一套后端接口</div>";
  mountMiniIcons(body);

  var out = document.getElementById("out");
  if (out) out.onclick = function () {
    Api.logout().then(function () {
      user = null;
      toast("已退出登录", "ok");
      render();
    });
  };
  var login = document.getElementById("login");
  if (login) login.onclick = function () {
    login.disabled = true;
    login.textContent = "授权中…";
    Api.wechatLogin(DEMO_CODE, "微信用户").then(function () {
      toast("登录成功", "ok");
      return loadProfile();
    }, function (error) {
      window.showError(error);
      render();
    });
  };
}

function countOf(status) {
  return Api.get("/v1/orders?status=" + status + "&page=1&size=1", { silent: true })
    .then(function (page) { return page.total || 0; }, function () { return 0; });
}

function loadProfile() {
  if (!Api.isLoggedIn()) { render(); return Promise.resolve(); }
  return Api.profile().then(function (profile) {
    user = profile;
    return Promise.all([
      countOf("PENDING_PAYMENT"), countOf("PENDING_SHIPMENT"),
      countOf("PENDING_RECEIPT"), countOf("COMPLETED"),
      Api.get("/v1/addresses", { silent: true }).then(function (list) { return (list || []).length; }, function () { return 0; })
    ]);
  }).then(function (res) {
    if (!res) { render(); return; }
    counts = { PENDING_PAYMENT: res[0], PENDING_SHIPMENT: res[1], PENDING_RECEIPT: res[2], COMPLETED: res[3] };
    addressCount = res[4];
    render();
  }, function (error) {
    showError(error);
    render();
  });
}

window.Store.refreshCartCount();
loadProfile();
</script>
</body>
</html>
