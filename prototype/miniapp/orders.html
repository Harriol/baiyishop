<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的订单 · 百益商城小程序</title>
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="assets/mini.css">
</head>
<body>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="assets/mini-shell.js"></script>
<script>
var body = miniShell({ title: "我的订单", back: "profile.html", tabs: false });
var cur = (qs("status", "ALL") || "ALL").toUpperCase();
var page = 1;
var result = { total: 0, list: [] };
var TABS = [["ALL", "全部"], ["PENDING_PAYMENT", "待付款"], ["PENDING_SHIPMENT", "待发货"], ["PENDING_RECEIPT", "待收货"], ["COMPLETED", "已完成"], ["CANCELLED", "已取消"]];

function actions(order) {
  var no = encodeURIComponent(order.orderNo);
  if (order.status === "PENDING_PAYMENT") {
    return "<button class=\"m-btn price\" style=\"height:30px;font-size:12px\" data-pay=\"" + no + "\">立即支付</button>"
      + "<button class=\"m-btn plain\" style=\"height:30px;font-size:12px\" data-cancel=\"" + order.orderNo + "\">取消</button>";
  }
  if (order.status === "PENDING_RECEIPT") return "<button class=\"m-btn\" style=\"height:30px;font-size:12px\" data-recv=\"" + order.orderNo + "\">确认收货</button>";
  if (order.status === "COMPLETED" || order.status === "CANCELLED") {
    return "<button class=\"m-btn plain\" style=\"height:30px;font-size:12px\" data-again=\"" + order.orderNo + "\">再次购买</button>";
  }
  return "<span class=\"small faint\">等待商家发货</span>";
}

function render() {
  var list = result.list || [];
  body.innerHTML = "<div style=\"padding:8px 8px 0;display:flex;gap:6px;overflow-x:auto;background:var(--surface)\" id=\"tabs\">"
    + TABS.map(function (t) {
        return "<button class=\"m-tag\" data-t=\"" + t[0] + "\" style=\"flex:none;padding:5px 10px;border:0;"
          + (t[0] === cur ? "background:var(--brand-tint);color:var(--brand-dark);font-weight:600" : "") + "\">" + t[1] + "</button>";
      }).join("") + "</div>"
    + "<div style=\"padding:10px 12px\">" + (list.length ? list.map(function (order) {
        var first = (order.items || [])[0] || {};
        return "<div style=\"background:var(--surface);border-radius:10px;margin-bottom:10px;overflow:hidden\">"
          + "<div class=\"row\" style=\"padding:9px 12px;border-bottom:1px solid var(--line-2)\"><span class=\"small faint\">" + esc(order.orderNo) + "</span>"
          + "<span style=\"margin-left:auto\">" + statusPill(order.status) + "</span></div>"
          + "<div class=\"m-row\" style=\"border:0\"><img class=\"pic\" src=\"" + img(first.productImage, "headphone-01") + "\" alt=\"\">"
          + "<div class=\"grow\"><div class=\"nm clamp2\" style=\"font-size:12.5px\">" + esc(first.productName || "") + "</div>"
          + "<div class=\"small faint mt8\">" + formatTime(order.createdAt) + " · 共 " + (order.totalQuantity || 0) + " 件</div></div>"
          + "<span style=\"color:var(--price);font-weight:700\">" + yuanPlain(order.payAmount) + "</span></div>"
          + "<div class=\"row\" style=\"padding:8px 12px;border-top:1px solid var(--line-2);gap:8px;justify-content:flex-end\">" + actions(order) + "</div></div>";
      }).join("") : "<div class=\"empty\" style=\"padding-top:70px\"><i data-icon=\"package\" data-size=\"38\"></i><h4>暂无相关订单</h4></div>")
    + (result.total > (result.list || []).length
        ? "<button class=\"m-btn plain full\" id=\"more\">加载更多（" + result.list.length + "/" + result.total + "）</button>"
        : "")
    + "</div>";

  body.querySelectorAll("[data-t]").forEach(function (b) {
    b.onclick = function () { cur = b.dataset.t; page = 1; result = { total: 0, list: [] }; load(); };
  });
  body.querySelectorAll("[data-pay]").forEach(function (b) {
    b.onclick = function () { location.href = "../pay.html?no=" + b.dataset.pay; };
  });
  body.querySelectorAll("[data-cancel]").forEach(function (b) {
    b.onclick = function () {
      Api.put("/v1/orders/" + encodeURIComponent(b.dataset.cancel) + "/cancel").then(function () {
        toast("订单已取消", "ok");
        page = 1;
        result = { total: 0, list: [] };
        load();
      }, function (error) { window.showError(error); });
    };
  });
  body.querySelectorAll("[data-recv]").forEach(function (b) {
    b.onclick = function () {
      Api.put("/v1/orders/" + encodeURIComponent(b.dataset.recv) + "/receive").then(function () {
        toast("确认收货成功", "ok");
        page = 1;
        result = { total: 0, list: [] };
        load();
      }, function (error) { window.showError(error); });
    };
  });
  body.querySelectorAll("[data-again]").forEach(function (b) {
    b.onclick = function () { buyAgain(b.dataset.again, b); };
  });
  var more = document.getElementById("more");
  if (more) more.onclick = function () { page++; load(); };
  mountMiniIcons(body);
}

function buyAgain(orderNo, button) {
  var order = (result.list || []).filter(function (o) { return o.orderNo === orderNo; })[0];
  if (!order) return;
  button.disabled = true;
  var chain = Promise.resolve();
  (order.items || []).forEach(function (item) {
    chain = chain.then(function () { return Api.post("/v1/carts/items", { skuId: item.skuId, quantity: item.quantity }); });
  });
  chain.then(function () {
    toast("已加入购物车", "ok");
    window.Store.refreshCartCount();
  }, function (error) { window.showError(error); }).then(function () { button.disabled = false; });
}

function load() {
  if (!window.Api.isLoggedIn()) {
    body.innerHTML = "<div class=\"empty\" style=\"padding-top:80px\"><i data-icon=\"package\" data-size=\"38\"></i><h4>登录后查看订单</h4>"
      + "<a class=\"m-btn price mt16\" href=\"profile.html\">去登录</a></div>";
    mountMiniIcons(body);
    return;
  }
  Api.get("/v1/orders?status=" + encodeURIComponent(cur) + "&page=" + page + "&size=5").then(function (data) {
    result = { total: data.total, list: (page === 1 ? data.list : result.list.concat(data.list)) || [] };
    render();
  }, function (error) {
    body.innerHTML = "<div class=\"empty\" style=\"padding-top:80px\"><i data-icon=\"circle-alert\" data-size=\"32\"></i><h4>订单加载失败</h4><p class=\"small\">" + esc(error.message) + "</p></div>";
    mountMiniIcons(body);
  });
}

load();
</script>
</body>
</html>
