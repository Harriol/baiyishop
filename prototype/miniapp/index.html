<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首页 · 百益商城小程序</title>
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="assets/mini.css">
</head>
<body>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="assets/mini-shell.js"></script>
<script>
var body = miniShell({ tab: "home", title: "百益商城" });
var running = DB.seckill.sessions.filter(function (s) { return s.status === "RUNNING"; })[0] || DB.seckill.sessions[0];
var flash = DB.seckill.items.filter(function (i) { return i.sessionId === running.id; }).slice(0, 3);
var banners = DB.home.banners;
function card(p) {
  return "<a class=\"m-card\" href=\"product.html?id=" + p.id + "\"><div class=\"ph\"><img src=\"" + img(p.image) + "\" alt=\"\"></div>"
    + "<div class=\"in\"><div class=\"nm\">" + p.name + "</div><div class=\"pr\">" + yuanPlain(p.price) + "</div></div></a>";
}
body.innerHTML =
  "<div class=\"m-search\"><a class=\"box\" href=\"category.html\"><i data-icon=\"search\" data-size=\"15\"></i>搜索商品，如「耳机」</a></div>"
  + "<div class=\"m-banner\"><img src=\"" + img(banners[0].image) + "\" alt=\"\"><div class=\"cap\">" + banners[0].title + " · " + banners[0].subtitle + "</div></div>"
  + "<div class=\"m-nav\">" + DB.home.navs.slice(0, 10).map(function (n) {
      var href = n.href ? n.href : ("category.html?id=" + n.categoryId);
      return "<a href=\"" + href + "\"><span class=\"ic\"><i data-icon=\"" + n.icon + "\" data-size=\"18\"></i></span>" + n.name + "</a>";
    }).join("") + "</div>"
  + "<div class=\"m-sec\"><div class=\"m-sec-head\"><h3><i data-icon=\"zap\" data-size=\"16\" style=\"color:var(--price)\"></i>限时秒杀</h3>"
    + "<a class=\"small\" style=\"color:var(--brand)\" href=\"../seckill.html\">更多 ></a></div>"
    + "<div class=\"m-list\">" + flash.map(function (it) {
        var p = P(it.productId);
        return "<div class=\"m-row\"><img class=\"pic\" src=\"" + img(p.image) + "\" alt=\"\">"
          + "<div class=\"grow\"><div class=\"nm clamp2\" style=\"font-size:12.5px\">" + p.name + "</div>"
          + "<div class=\"row g6 mt8\"><span style=\"color:var(--price);font-weight:700\">" + yuanPlain(it.seckillPrice) + "</span>"
          + "<span class=\"price-origin small\">" + yuanPlain(it.originPrice) + "</span></div>"
          + "<div class=\"progress mt8\"><i style=\"width:" + Math.round(it.sold / it.total * 100) + "%\"></i></div></div>"
          + "<a class=\"m-btn price\" style=\"height:30px;padding:0 12px;font-size:12px\" href=\"../seckill.html\">去抢</a></div>";
      }).join("") + "</div></div>"
  + DB.home.floors.slice(0, 3).map(function (f) {
      var list = categoryProducts(f.categoryId, f.sortField).slice(0, 4);
      return "<div class=\"m-sec\"><div class=\"m-sec-head\"><h3>" + f.title + "</h3>"
        + "<a class=\"small\" style=\"color:var(--brand)\" href=\"category.html?id=" + f.categoryId + "\">更多 ></a></div>"
        + "<div class=\"m-grid\">" + list.map(card).join("") + "</div></div>";
    }).join("") + "<div style=\"height:12px\"></div>";
mountMiniIcons(document);
</script>
</body>
</html>
