<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首页 · 百益商城</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main class="container">
<section class="section" style="margin-top:16px">
  <div class="home-hero">
    <nav class="hero-cats" id="heroCats" aria-label="商品分类导航"></nav>
    <div class="banner-strip" id="banner">
      <img id="bannerImg" alt="">
      <div class="caption"><h3 id="bannerTitle"></h3><p class="small" id="bannerSub" style="opacity:.85"></p></div>
      <div class="banner-dots" id="bannerDots"></div>
    </div>
  </div>
  <div class="notice-bar">
    <i data-icon="info" data-size="15"></i>
    <span class="grow ellipsis" id="noticeText"></span>
    <span class="small faint nowrap">本场秒杀</span>
    <span class="countdown" id="flashCd"></span>
    <a class="btn btn-sm" href="seckill.html">去抢购<i data-icon="chevron-right" data-size="14"></i></a>
  </div>
</section>

<section class="section">
  <div class="kingkong" id="kingkong"></div>
</section>

<section class="section" id="flashSection"></section>

<div id="floors"></div>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/ui.js"></script>
<script>
pageInit("home");

function iconName(value) {
  // 后台配置的图标可能是表情或图片地址：不是雪碧图里已有的名字时退回默认图标
  return (value && value.length <= 20 && !/[:/]/.test(value)) ? value : "layout-grid";
}

/* 首页聚合：轮播 / 公告 / 金刚区 / 楼层 */
Api.get("/v1/home").then(function (home) {
  /* 轮播 */
  var banners = home.banners || [], bi = 0;
  function paintBanner() {
    if (!banners.length) { document.getElementById("banner").style.display = "none"; return; }
    var b = banners[bi];
    document.getElementById("bannerImg").src = img(b.imageUrl, "banner-0" + (bi % 3 + 1));
    document.getElementById("bannerImg").alt = b.title || "百益商城";
    document.getElementById("bannerTitle").textContent = b.title || "";
    document.getElementById("bannerSub").textContent = "百益商城 · 全场包邮";
    document.getElementById("bannerDots").innerHTML = banners.map(function (_, i) {
      return "<i class=\"" + (i === bi ? "on" : "") + "\"></i>";
    }).join("");
  }
  paintBanner();
  if (banners.length > 1) {
    setInterval(function () { bi = (bi + 1) % banners.length; paintBanner(); }, 5000);
    document.getElementById("bannerDots").addEventListener("click", function (ev) {
      if (ev.target.tagName !== "I") return;
      bi = Array.prototype.indexOf.call(ev.currentTarget.children, ev.target);
      paintBanner();
    });
  }

  /* 左侧三级分类导航（悬停展开二级 / 三级） */
  return Store.categories().then(function () {
    document.getElementById("heroCats").innerHTML =
      "<ul>" + catTree().map(function (l1) {
        var rows = l1.children.map(function (l2) {
          var l3 = l2.children.map(function (c) {
            return "<a href=\"category.html?id=" + c.id + "\">" + esc(c.name) + "</a>";
          }).join("");
          return "<div class=\"fly-row\"><dt><a href=\"category.html?id=" + l2.id + "\">" + esc(l2.name) + "</a></dt>"
            + "<dd>" + (l3 || "<span class=\"small faint\">暂无子分类</span>") + "</dd></div>";
        }).join("");
        return "<li><a class=\"hero-cat\" href=\"category.html?id=" + l1.id + "\">" + esc(l1.name)
          + "<i data-icon=\"chevron-right\" data-size=\"14\" class=\"more\"></i></a>"
          + "<div class=\"hero-flyout\"><div class=\"fly-title\"><i data-icon=\"layout-grid\" data-size=\"14\"></i>"
          + esc(l1.name) + "</div><dl>" + rows + "</dl></div></li>";
      }).join("")
      + "<li><a class=\"hero-cat hero-more\" href=\"category.html\">查看全部分类<i data-icon=\"chevron-right\" data-size=\"14\"></i></a></li>"
      + "</ul>";
    mountIcons(document.getElementById("heroCats"));

    /* 公告轮播 */
    var notices = home.notices || [];
    if (notices.length) {
      var ni = 0;
      document.getElementById("noticeText").textContent = notices[ni].content;
      if (notices.length > 1) {
        setInterval(function () {
          ni = (ni + 1) % notices.length;
          document.getElementById("noticeText").textContent = notices[ni].content;
        }, 4000);
      }
    } else {
      document.getElementById("noticeText").textContent = "暂无公告";
    }

    /* 金刚区 */
    var navs = home.navs || [];
    document.getElementById("kingkong").innerHTML = navs.map(function (n) {
      var href = n.categoryId ? ("category.html?id=" + n.categoryId) : "category.html";
      return "<a href=\"" + href + "\"><span class=\"kk-icon\"><i data-icon=\"" + iconName(n.icon)
        + "\" data-size=\"20\"></i></span><span>" + esc(n.name) + "</span></a>";
    }).join("");

    /* 楼层（后端已按楼层配置的排序维度拉好商品） */
    var floors = home.floors || [];
    document.getElementById("floors").innerHTML = floors.map(function (f) {
      var list = f.products || [];
      var body = list.length ? list.map(productCard).join("") : emptyHTML("该分类暂无商品", "换个分类或稍后再来");
      return "<section class=\"section\"><div class=\"section-head\">"
        + "<div class=\"section-title\">" + esc(f.title) + "</div>"
        + "<span class=\"small faint\">按" + sortLabel(f.sortField) + "排序</span>"
        + "<a class=\"btn btn-sm\" href=\"category.html?id=" + f.categoryId + "\">更多<i data-icon=\"chevron-right\" data-size=\"14\"></i></a>"
        + "</div><div class=\"grid-products\">" + body + "</div></section>";
    }).join("");
    mountIcons(document);
  });
}).catch(showError);

/* 秒杀：进行中场次倒计时 + 预告条 */
Api.get("/v1/seckill/activities?limit=5").then(function (list) {
  var sessions = list || [];
  var running = sessions.filter(function (s) { return s.status === "RUNNING"; })[0]
    || sessions.filter(function (s) { return s.status === "NOT_STARTED"; })[0];
  if (!running) return;
  document.getElementById("flashCd").previousElementSibling
    && (document.getElementById("flashCd").previousElementSibling.textContent = running.status === "RUNNING" ? "本场秒杀" : "即将开始");
  countdown(document.getElementById("flashCd"), running.endTime);
  var items = (running.skus || []).slice(0, 4);
  if (!items.length) return;
  document.getElementById("flashSection").innerHTML =
    "<div class=\"flash-head\"><h3><i data-icon=\"zap\" data-size=\"18\"></i>限时秒杀</h3>"
    + "<span class=\"small\" style=\"opacity:.8\">整点开抢 · 每人限购</span>"
    + "<a class=\"btn btn-sm\" href=\"seckill.html\" style=\"margin-left:auto\">查看全部</a></div>"
    + "<div class=\"grid-products\" style=\"margin-top:12px\">"
    + items.map(function (it) {
        var remaining = (it.remaining === null || it.remaining === undefined) ? it.allocStock : it.remaining;
        var sold = Math.max(0, (it.allocStock || 0) - remaining);
        var soldOut = remaining <= 0;
        return "<a class=\"product-card\" href=\"seckill.html\">"
          + "<div class=\"product-thumb\"><img src=\"" + img(it.image, "headphone-01") + "\" alt=\"" + esc(it.productName) + "\" loading=\"lazy\">"
          + "<span class=\"corner\"><span class=\"tag tag-solid\">" + (soldOut ? "已售罄" : "秒杀") + "</span></span></div>"
          + "<div class=\"product-info\"><h4 class=\"product-name clamp2\">" + esc(it.productName) + "</h4>"
          + "<div class=\"product-meta\"><span class=\"price\">" + yuan(it.seckillPrice) + "</span>"
          + "<span class=\"price-origin small\">" + yuanPlain(it.originalPrice) + "</span></div>"
          + "<div class=\"progress\"><i style=\"width:" + Math.round(sold / Math.max(1, it.allocStock) * 100) + "%\"></i></div>"
          + "<span class=\"small faint\">已抢 " + sold + " / " + (it.allocStock || 0) + "</span></div></a>";
      }).join("")
    + "</div>";
  mountIcons(document);
}).catch(function () { /* 秒杀区异常不影响首页其它内容 */ });
</script>
</body>
</html>
