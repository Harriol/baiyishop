<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全部分类 · 百益商城</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main class="container">
<div class="crumb"><a href="index.html">首页</a><i data-icon="chevron-right" data-size="13"></i><span id="crumbCat">全部分类</span></div>
<div class="split" style="margin-top:14px">
  <aside class="card card-flush">
    <div class="card-head"><h3 style="font-size:15px">商品分类</h3></div>
    <div id="tree"></div>
  </aside>
  <section>
    <div class="card card-tight between" style="flex-wrap:wrap;gap:10px">
      <div class="segmented" id="sortSeg">
        <button data-value="sales" class="on">销量</button>
        <button data-value="new">上新</button>
        <button data-value="price_asc">价格升</button>
        <button data-value="price_desc">价格降</button>
      </div>
      <span class="small faint" id="count"></span>
    </div>
    <div class="grid-products" id="grid" style="margin-top:14px"></div>
    <div class="pagination" id="pager"></div>
  </section>
</div>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
pageInit("category");

var curCat = Number(qs("id", 0));
var curSort = qs("sort", "sales");
var curPage = 1;
var PAGE = 8;
var total = 0;
var expanded = {};

document.querySelectorAll("#sortSeg button").forEach(function (b) {
  if (b.dataset.value === curSort) {
    document.querySelectorAll("#sortSeg button").forEach(function (x) { x.classList.remove("on"); });
    b.classList.add("on");
  }
});
bindTabs("#sortSeg", function (value) { curSort = value; curPage = 1; renderList(); });

function renderTree() {
  var box = document.getElementById("tree");
  var html = "<div class=\"cat-tree\">";
  catTree().forEach(function (l1) {
    html += nodeHTML(l1, 1);
    if (expanded[l1.id]) {
      l1.children.forEach(function (l2) {
        html += nodeHTML(l2, 2);
        if (expanded[l2.id]) {
          (l2.children || []).forEach(function (l3) { html += nodeHTML(l3, 3); });
        }
      });
    }
  });
  html += "</div>";
  box.innerHTML = html;

  box.querySelectorAll("[data-cat]").forEach(function (b) {
    b.addEventListener("click", function (ev) {
      if (ev.target.dataset.toggle) return;   // 点箭头只展开，不筛选
      curCat = Number(b.dataset.cat);
      curPage = 1;
      if (Number(b.dataset.lv) < 3) expanded[curCat] = true;
      renderTree();
      renderList();
    });
  });
  box.querySelectorAll("[data-toggle]").forEach(function (t) {
    t.addEventListener("click", function (ev) {
      ev.stopPropagation();
      var id = Number(t.dataset.toggle);
      expanded[id] = !expanded[id];
      renderTree();
    });
  });
}

function nodeHTML(cat, level) {
  var hasKids = level < 3 && (cat.children || []).length > 0;
  var count = cat.id === curCat && total ? "<span class=\"count\">" + total + "</span>" : "";
  return "<button class=\"cat-node l" + level + " " + (curCat === cat.id ? "on" : "") + "\" data-cat=\"" + cat.id + "\" data-lv=\"" + level + "\">"
    + "<span class=\"cat-caret " + (expanded[cat.id] ? "exp" : "") + "\" data-toggle=\"" + cat.id + "\">" + (hasKids ? "›" : "") + "</span>"
    + esc(cat.name) + count + "</button>";
}

function renderList() {
  if (!curCat) return;
  var chain = catPath(curCat);
  document.getElementById("crumbCat").innerHTML = chain.length
    ? chain.map(function (c) { return "<a href=\"category.html?id=" + c.id + "\">" + esc(c.name) + "</a>"; }).join(" <span class=\"faint\">/</span> ")
    : "全部分类";
  return categoryProducts(curCat, curSort, curPage, PAGE).then(function (page) {
    total = page.total || 0;
    document.getElementById("count").textContent = "共 " + total + " 件商品 · 按" + sortLabel(curSort) + "排序";
    mountGrid("#grid", page.list || []);
    renderPager();
    renderTree();
  }, showError);
}

function renderPager() {
  var pages = Math.max(1, Math.ceil(total / PAGE));
  var el = document.getElementById("pager");
  if (pages <= 1) { el.innerHTML = ""; return; }
  var html = "<button " + (curPage === 1 ? "disabled" : "") + " data-p=\"1\">首页</button>";
  for (var i = 1; i <= pages; i++) html += "<button class=\"" + (i === curPage ? "on" : "") + "\" data-p=\"" + i + "\">" + i + "</button>";
  html += "<button " + (curPage === pages ? "disabled" : "") + " data-p=\"" + pages + "\">末页</button>";
  el.innerHTML = html;
  el.querySelectorAll("[data-p]").forEach(function (b) {
    b.addEventListener("click", function () { curPage = Number(b.dataset.p); renderList(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  });
}

function boot() {
  Store.categories().then(function () {
    if (!curCat) {
      var first = catTree()[0];
      curCat = first ? first.id : 0;
    }
    catPath(curCat).forEach(function (c) { expanded[c.id] = true; });
    renderTree();
    renderList();
    document.getElementById("grid").innerHTML = "<div class=\"empty\" style=\"grid-column:1/-1\"><i data-icon=\"loader-circle\" data-size=\"34\"></i><h4>正在加载商品…</h4></div>";
    mountIcons(document.getElementById("grid"));
  }, showError);
}

boot();
</script>
</body>
</html>
