<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>支付结果 · 百益商城</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main class="container" style="max-width:720px">
<div id="steps"></div>
<div class="card" style="text-align:center;padding:32px 20px">
  <div id="icon"></div>
  <h2 id="title" class="mt12"></h2>
  <p class="muted small mt8" id="desc"></p>
  <div class="mt16" id="amount" style="font-size:26px"></div>
  <div class="row g12 center mt24" style="flex-wrap:wrap" id="actions"></div>
</div>
<div class="card mt12" id="info"></div>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
pageInit("orders");
document.getElementById("steps").innerHTML = stepbar(4);
var result = qs("result", "success");
var paid = JSON.parse(sessionStorage.getItem("baiyi_paid") || "null") || { orderNo: "2026092710123344556677", payAmount: "899.00", channel: "WECHAT", payTime: "2026-09-27 10:14:02" };
var ok = result === "success";
var chName = paid.channel === "ALIPAY" ? "支付宝" : "微信支付";
document.getElementById("icon").innerHTML = "<i data-icon=\"" + (ok ? "circle-check" : "circle-x") + "\" data-size=\"56\" style=\"color:" + (ok ? "var(--brand)" : "var(--price)") + "\"></i>";
document.getElementById("title").textContent = ok ? "支付成功" : "支付失败";
document.getElementById("desc").textContent = ok ? "订单已进入待发货状态，商家会尽快为你发货" : "支付未完成，订单仍在待付款状态，可在 15 分钟内重新支付";
document.getElementById("amount").innerHTML = "<span class=\"price\">" + yuan(paid.payAmount) + "</span>";
document.getElementById("actions").innerHTML = ok
  ? "<a class=\"btn btn-primary btn-lg\" href=\"order-detail.html?no=" + paid.orderNo + "\">查看订单</a><a class=\"btn btn-lg\" href=\"index.html\">继续逛逛</a>"
  : "<a class=\"btn btn-price btn-lg\" href=\"pay.html\">重新支付</a><a class=\"btn btn-lg\" href=\"orders.html\">查看订单</a>";
document.getElementById("info").innerHTML =
  "<div class=\"amount-row\"><span class=\"muted\">订单号</span><span>" + paid.orderNo + "</span></div>"
  + "<div class=\"amount-row\"><span class=\"muted\">支付方式</span><span>" + chName + "（模拟）</span></div>"
  + "<div class=\"amount-row\"><span class=\"muted\">支付时间</span><span>" + (ok ? paid.payTime : "—") + "</span></div>"
  + "<div class=\"amount-row\"><span class=\"muted\">发货时效</span><span>48 小时内发出</span></div>";
mountIcons(document);
</script>
</body>
</html>
