<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品编辑 · 百益后台</title>
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="assets/admin-shell.js"></script>
<script>
if (adminShell("products", { title: "商品编辑", crumb: "商品", perm: "product" })) {
  var editId = Number(qs("id", 0));
  var cur = editId ? P(editId) : null;
  var chain = cur ? catPath(cur.categoryId) : [];
  var skuCode = cur ? cur.id + "-01" : "保存后自动生成（商品 ID + 序号）";

  function opts(list, sel, fmt) {
    return list.map(function (x) { return "<option value=\"" + x.id + "\"" + (x.id === sel ? " selected" : "") + ">" + (fmt ? fmt(x) : x.name) + "</option>"; }).join("");
  }

  function paintL2() {
    var l1 = Number(document.getElementById("f-cat1").value);
    var kids = catTree().filter(function (c) { return c.id === l1; })[0].children;
    document.getElementById("f-cat2").innerHTML = opts(kids, chain[1] ? chain[1].id : 0);
    paintL3();
  }
  function paintL3() {
    var l2 = Number(document.getElementById("f-cat2").value);
    var node = catTree().filter(function (c) { return c.id === Number(document.getElementById("f-cat1").value); })[0]
      .children.filter(function (c) { return c.id === l2; })[0];
    document.getElementById("f-cat3").innerHTML = opts(node.children || [], chain[2] ? chain[2].id : 0);
  }

  var paramNames = ["材质", "产地", "重量", "规格"];
  document.getElementById("content").innerHTML =
    "<div class=\"panel\"><div class=\"panel-head\"><h3>" + (cur ? "编辑商品 · " + cur.name : "新增商品") + "</h3>"
    + "<div class=\"inline\"><a class=\"btn btn-sm\" href=\"products.html\">返回列表</a><button class=\"btn btn-primary btn-sm\" id=\"save\">保存商品</button></div></div>"
    + "<div class=\"panel-body\"><div class=\"form-grid\">"
    + "<div class=\"form-section\">基础信息</div>"
    + "<div class=\"form-row\"><label>商品名称</label><div><input class=\"input\" id=\"f-name\" value=\"" + (cur ? cur.name : "") + "\" placeholder=\"请输入商品名称\"></div></div>"
    + "<div class=\"form-row\"><label>商品分类</label><div class=\"inline\">"
    + "<select class=\"select\" id=\"f-cat1\" style=\"min-width:140px\">" + opts(catTree(), chain[0] ? chain[0].id : null) + "</select>"
    + "<select class=\"select\" id=\"f-cat2\" style=\"min-width:140px\"></select>"
    + "<select class=\"select\" id=\"f-cat3\" style=\"min-width:140px\"></select></div></div>"
    + "<div class=\"form-row\"><label>品牌</label><div><select class=\"select\" id=\"f-brand\">" + opts(DB.brands, cur ? cur.brandId : null) + "</select></div></div>"
    + "<div class=\"form-row\"><label>主图</label><div><div class=\"inline\"><img src=\"" + img(cur ? cur.image : "tee-01") + "\" alt=\"\" style=\"width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)\">"
      + "<div><button class=\"btn btn-sm\" id=\"up\"><i data-icon=\"plus\" data-size=\"14\"></i>上传图片</button><div class=\"hint\">正式实现上传到 MinIO，返回 URL（REQ-203）</div></div></div></div></div>"
    + "<div class=\"form-section\">价格与库存</div>"
    + "<div class=\"form-row\"><label>SKU</label><div class=\"table-wrap\"><table class=\"table\"><thead><tr><th>规格名</th><th>SKU 编码</th><th>价格（元）</th><th>库存</th></tr></thead><tbody><tr>"
    + "<td><input class=\"input\" value=\"默认规格\" style=\"min-width:110px\"></td>"
    + "<td><code class=\"small muted\">" + skuCode + "</code></td>"
    + "<td><input class=\"input\" id=\"f-price\" value=\"" + (cur ? cur.price : "") + "\" style=\"width:110px\"></td>"
    + "<td><input class=\"input\" id=\"f-stock\" value=\"" + (cur ? cur.stock : "") + "\" style=\"width:100px\"></td>"
    + "</tr></tbody></table><div class=\"hint\">本期为单规格，保留 SKU 结构（每商品一个默认 SKU）</div></div></div>"
    + "<div class=\"form-section\">商品参数</div>"
    + "<div class=\"form-row\"><label>参数模板</label><div><select class=\"select\" id=\"f-tpl\"><option>通用参数模板</option><option>服饰类参数</option><option>数码类参数</option></select>"
      + "<div class=\"hint\">参数项由后台统一维护，商品从模板中选择参数项并填值（REQ-204）</div></div></div>"
    + "<div class=\"form-row\"><label>参数值</label><div class=\"table-wrap\"><table class=\"table\"><thead><tr><th style=\"width:120px\">参数项</th><th>值</th></tr></thead><tbody>"
    + paramNames.map(function (n) {
        var val = cur && cur.params[n] ? cur.params[n] : "";
        return "<tr><td>" + n + "</td><td><input class=\"input\" value=\"" + val + "\" placeholder=\"请输入" + n + "\"></td></tr>";
      }).join("")
    + "</tbody></table></div></div>"
    + "<div class=\"form-section\">商品详情</div>"
    + "<div class=\"form-row\"><label>详情</label><div><textarea class=\"textarea\" rows=\"6\" placeholder=\"富文本详情\">" + (cur ? "商品详情富文本内容（正式实现为富文本编辑器，入库前做 XSS 白名单过滤）" : "") + "</textarea></div></div>"
    + "<div class=\"form-row\"><label></label><div class=\"inline\"><button class=\"btn btn-primary\" id=\"save2\">保存商品</button><a class=\"btn\" href=\"products.html\">取消</a></div></div>"
    + "</div></div></div>";
  document.getElementById("f-cat1").onchange = paintL2;
  document.getElementById("f-cat2").onchange = paintL3;
  paintL2();
  function save() {
    var name = document.getElementById("f-name").value.trim();
    if (!name) { toast("请填写商品名称", "err"); return; }
    if (!Number(document.getElementById("f-price").value)) { toast("请填写正确的价格", "err"); return; }
    toast("保存成功，商品索引同步任务已投递", "ok");
    setTimeout(function () { location.href = "products.html"; }, 800);
  }
  document.getElementById("save").onclick = save;
  document.getElementById("save2").onclick = save;
  document.getElementById("up").onclick = function () { toast("原型不做真实上传，正式实现走 MinIO"); };
  mountIcons(document.getElementById("content"));
}
</script>
</body>
</html>
