<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品编辑 · 百益后台</title>
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="assets/admin-shell.js"></script>
<script>
if (adminShell("products", { title: "商品编辑", crumb: "商品", perm: "product:write" })) {
  var editId = Number(qs("id", 0)) || 0;
  var categories = [];      // 扁平（含隐藏），用于三级级联
  var tree = [];
  var brands = [];
  var templates = [];
  var product = null;
  var skuStock = null;
  var saving = false;

  function flatten(nodes, out) {
    (nodes || []).forEach(function (n) {
      out.push(n);
      flatten(n.children, out);
    });
    return out;
  }

  function childrenOf(parentId) {
    return categories.filter(function (c) { return (c.parentId || 0) === Number(parentId); });
  }

  function options(list, selected, withEmpty) {
    return (withEmpty ? "<option value=\"\">请选择</option>" : "")
      + list.map(function (c) {
        return "<option value=\"" + c.id + "\"" + (Number(selected) === c.id ? " selected" : "") + ">" + esc(c.name) + "</option>";
      }).join("");
  }

  function paintL2() {
    var l1 = Number(document.getElementById("f-cat1").value);
    if (!l1) {
      document.getElementById("f-cat2").innerHTML = "";
      document.getElementById("f-cat3").innerHTML = "";
      return;
    }
    var l2 = childrenOf(l1);
    var current = product ? catAt(product.categoryId, 2) : null;
    document.getElementById("f-cat2").innerHTML = options(l2, current ? current.id : 0, true);
    if (!l2.length) { document.getElementById("f-cat2").innerHTML = ""; paintL3(); return; }
    if (!current) document.getElementById("f-cat2").value = "";
    paintL3();
  }

  function paintL3() {
    var l2 = Number(document.getElementById("f-cat2").value);
    var l3 = l2 ? childrenOf(l2) : [];
    var current = product ? catAt(product.categoryId, 3) : null;
    document.getElementById("f-cat3").innerHTML = options(l3, current ? current.id : 0, true);
    if (!l3.length) document.getElementById("f-cat3").innerHTML = "";
  }

  /** 商品分类在某一层级上的节点 */
  function catAt(categoryId, level) {
    var node = categories.filter(function (c) { return c.id === Number(categoryId); })[0];
    while (node && node.level > level) node = categories.filter(function (c) { return c.id === node.parentId; })[0];
    return node && node.level === level ? node : null;
  }

  /** 取最深的已选分类：后端要求 categoryId 为叶子 */
  function pickedCategory() {
    var l3 = Number(document.getElementById("f-cat3").value || 0);
    if (l3) return l3;
    var l2 = Number(document.getElementById("f-cat2").value || 0);
    if (l2) return l2;
    return Number(document.getElementById("f-cat1").value || 0);
  }

  function currentTemplate() {
    var id = Number(document.getElementById("f-tpl").value || 0);
    return templates.filter(function (t) { return t.id === id; })[0] || null;
  }

  function paintParams() {
    var tpl = currentTemplate();
    var box = document.getElementById("paramRows");
    if (!tpl || !tpl.items || !tpl.items.length) {
      box.innerHTML = "<tr><td colspan=\"2\" class=\"small faint\">该模板下暂无参数项</td></tr>";
      return;
    }
    var values = {};
    ((product && product.params) || []).forEach(function (p) { values[p.name] = p.value; });
    box.innerHTML = tpl.items.map(function (item) {
      return "<tr><td>" + esc(item.name) + (item.unit ? "（" + esc(item.unit) + "）" : "") + "</td>"
        + "<td><input class=\"input\" data-param=\"" + item.id + "\" data-name=\"" + esc(item.name) + "\" value=\"" + esc(values[item.name] || "") + "\" placeholder=\"请输入" + esc(item.name) + "\"></td></tr>";
    }).join("");
  }

  /** 编辑时自动选中该商品参数所属的模板（参数项只能来自一个模板，否则保存会丢参数） */
  function pickTemplateFor(target) {
    if (!target || !(target.params || []).length || !templates.length) return null;
    var names = (target.params || []).map(function (p) { return p.name; });
    var best = null, bestHit = 0;
    templates.forEach(function (tpl) {
      var hit = (tpl.items || []).filter(function (item) { return names.indexOf(item.name) >= 0; }).length;
      if (hit > bestHit) { bestHit = hit; best = tpl; }
    });
    return best;
  }

  function renderForm() {
    var chain1 = product ? catAt(product.categoryId, 1) : null;
    var sku = product && product.skus && product.skus.length ? product.skus[0] : null;
    document.getElementById("content").innerHTML =
      "<div class=\"panel\"><div class=\"panel-head\"><h3>" + (product ? "编辑商品 · " + esc(product.name) : "新增商品") + "</h3>"
      + "<div class=\"inline\"><a class=\"btn btn-sm\" href=\"products.html\">返回列表</a><button class=\"btn btn-primary btn-sm\" id=\"save\">保存商品</button></div></div>"
      + "<div class=\"panel-body\"><div class=\"form-grid\">"
      + "<div class=\"form-section\">基础信息</div>"
      + "<div class=\"form-row\"><label>商品名称</label><div><input class=\"input\" id=\"f-name\" value=\"" + esc(product ? product.name : "") + "\" placeholder=\"请输入商品名称\"></div></div>"
      + "<div class=\"form-row\"><label>商品分类</label><div class=\"inline\">"
      + "<select class=\"select\" id=\"f-cat1\" style=\"min-width:140px\">" + options(tree, chain1 ? chain1.id : 0, true) + "</select>"
      + "<select class=\"select\" id=\"f-cat2\" style=\"min-width:140px\"></select>"
      + "<select class=\"select\" id=\"f-cat3\" style=\"min-width:140px\"></select>"
      + "<div class=\"hint\">分类最多三级，商品必须挂在叶子分类下</div></div></div>"
      + "<div class=\"form-row\"><label>品牌</label><div><select class=\"select\" id=\"f-brand\">"
      + "<option value=\"\">不指定品牌</option>"
      + brands.map(function (b) { return "<option value=\"" + b.id + "\"" + (product && product.brandId === b.id ? " selected" : "") + ">" + esc(b.name) + "</option>"; }).join("")
      + "</select></div></div>"
      + "<div class=\"form-row\"><label>商品主图</label><div><div class=\"inline\">"
      + "<img id=\"mainPreview\" src=\"" + img(product ? product.mainImage : "", "tee-01") + "\" alt=\"\" style=\"width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)\">"
      + "<div class=\"grow\"><div class=\"inline\"><button class=\"btn btn-sm\" id=\"upMain\" type=\"button\"><i data-icon=\"plus\" data-size=\"14\"></i>本地上传</button>"
      + "<span class=\"small faint\">JPG / PNG / WebP / GIF，≤5MB</span></div>"
      + "<input class=\"input mt8\" id=\"f-main\" value=\"" + esc(product ? product.mainImage : "") + "\" placeholder=\"上传后自动填入，也可直接粘贴图片地址\">"
      + "<div class=\"hint\">上传到 MinIO 后返回可访问 URL（REQ-203）</div></div></div></div></div>"
      + "<div class=\"form-row\"><label>商品图集</label><div>"
      + "<div class=\"inline\"><button class=\"btn btn-sm\" id=\"upGallery\" type=\"button\"><i data-icon=\"plus\" data-size=\"14\"></i>上传一张</button>"
      + "<span class=\"small faint\">每上传一张就追加到下面的地址列表</span></div>"
      + "<input class=\"input mt8\" id=\"f-images\" value=\"" + esc(((product && product.images) || []).join(",")) + "\" placeholder=\"多个地址用英文逗号分隔\">"
      + "<div class=\"hint\">首图与主图一致；留空则前台只展示主图</div></div></div>"
      + "<div class=\"form-section\">SKU 与价格</div>"
      + "<div class=\"form-row\"><label>SKU</label><div class=\"table-wrap\"><table class=\"table\"><thead><tr><th>规格名</th><th>SKU 编码</th><th>价格（元）</th><th>库存</th><th>启用</th></tr></thead><tbody><tr>"
      + "<td><input class=\"input\" id=\"f-spec\" value=\"" + esc(sku ? sku.specName : "默认规格") + "\" style=\"min-width:110px\"></td>"
      + "<td><code class=\"small muted\">" + (sku ? esc(sku.skuCode) : "保存后自动生成（商品 ID + 序号）") + "</code></td>"
      + "<td><input class=\"input\" id=\"f-price\" value=\"" + (sku ? Store.money(sku.price) : "") + "\" style=\"width:110px\" placeholder=\"59.00\"></td>"
      + "<td><span class=\"small muted\" id=\"f-stock\">" + (sku ? "查询中…" : "创建后为 0，请在库存管理调整") + "</span></td>"
      + "<td><input type=\"checkbox\" id=\"f-enabled\" " + (!sku || sku.enabled ? "checked" : "") + "></td>"
      + "</tr></tbody></table><div class=\"hint\">本期为单规格，保留 SKU 结构（每商品一个默认 SKU）</div></div></div>"
      + "<div class=\"form-section\">商品参数</div>"
      + "<div class=\"form-row\"><label>参数模板</label><div><select class=\"select\" id=\"f-tpl\">"
      + (templates.length
          ? templates.map(function (t) { return "<option value=\"" + t.id + "\">" + esc(t.name) + "</option>"; }).join("")
          : "<option value=\"\">（暂无可用模板）</option>")
      + "</select><div class=\"hint\">参数项由后台统一维护，商品从模板中选择参数项并填值（REQ-204）</div></div></div>"
      + "<div class=\"form-row\"><label>参数值</label><div class=\"table-wrap\"><table class=\"table\"><thead><tr><th style=\"width:160px\">参数项</th><th>值</th></tr></thead><tbody id=\"paramRows\"></tbody></table></div></div>"
      + "<div class=\"form-section\">商品详情</div>"
      + "<div class=\"form-row\"><label>详情</label><div><textarea class=\"textarea\" id=\"f-detail\" rows=\"6\" placeholder=\"富文本详情\">" + esc(product ? (product.detail || "") : "") + "</textarea>"
      + "<div class=\"hint\">入库前做 XSS 白名单过滤</div></div></div>"
      + "<div class=\"form-row\"><label>上架</label><div><label class=\"check\"><input type=\"checkbox\" id=\"f-onsale\" " + (!product || product.status === "ON_SALE" ? "checked" : "") + "><span>保存后立即上架（前台可见）</span></label></div></div>"
      + "<div class=\"form-row\"><label></label><div class=\"inline\"><button class=\"btn btn-primary\" id=\"save2\">保存商品</button><a class=\"btn\" href=\"products.html\">取消</a></div></div>"
      + "</div></div></div>";

    document.getElementById("f-cat1").onchange = paintL2;
    document.getElementById("f-cat2").onchange = paintL3;
    document.getElementById("f-tpl").onchange = paintParams;
    // 本地上传：主图直接覆盖，图集追加
    bindImageUpload(document.getElementById("upMain"), "product", function (url) {
      document.getElementById("f-main").value = url;
      document.getElementById("mainPreview").src = url;
      document.getElementById("mainPreview").dataset.imgFallback = "";
    });
    bindImageUpload(document.getElementById("upGallery"), "product", function (url) {
      var input = document.getElementById("f-images");
      input.value = input.value.trim() ? (input.value.replace(/[,\s]+$/, "") + "," + url) : url;
    });
    document.getElementById("f-main").addEventListener("change", function () {
      document.getElementById("mainPreview").src = img(this.value.trim(), "tee-01");
    });
    paintL2();
    var matchedTemplate = pickTemplateFor(product);
    if (matchedTemplate) document.getElementById("f-tpl").value = matchedTemplate.id;
    paintParams();
    document.getElementById("save").onclick = save;
    document.getElementById("save2").onclick = save;
    mountIcons(document.getElementById("content"));

    if (sku) {
      Api.get("/v1/admin/inventory?skuId=" + sku.id + "&page=1&size=1", { silent: true }).then(function (page) {
        var row = (page.list || [])[0];
        skuStock = row || null;
        document.getElementById("f-stock").innerHTML = row
          ? "<a href=\"inventory.html?skuId=" + sku.id + "\">" + row.available + "（去调整）</a>"
          : "未建库存记录";
      }, function () {
        document.getElementById("f-stock").textContent = "—";
      });
    }
  }

  function save() {
    if (saving) return;
    var categoryId = pickedCategory();
    var name = document.getElementById("f-name").value.trim();
    var mainImage = document.getElementById("f-main").value.trim();
    var priceYuan = document.getElementById("f-price").value.trim();
    if (!name) { toast("请填写商品名称", "err"); return; }
    if (!categoryId) { toast("请选择商品分类", "err"); return; }
    // 选了非叶子分类会被后端拒绝，这里提前给出明确提示
    if (childrenOf(categoryId).length) { toast("该分类下还有子分类，请选择最末级分类", "err"); return; }
    if (!mainImage) { toast("请填写主图地址", "err"); return; }
    if (!/^\d+(\.\d{1,2})?$/.test(priceYuan) || Number(priceYuan) <= 0) { toast("请填写正确的价格（元，最多两位小数）", "err"); return; }

    var params = [];
    document.querySelectorAll("[data-param]").forEach(function (input) {
      var value = input.value.trim();
      if (value) params.push({ paramItemId: Number(input.dataset.param), value: value });
    });

    var images = document.getElementById("f-images").value.split(",")
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s; });

    var body = {
      name: name,
      categoryId: categoryId,
      brandId: document.getElementById("f-brand").value ? Number(document.getElementById("f-brand").value) : null,
      mainImage: mainImage,
      images: images,
      detail: document.getElementById("f-detail").value,
      onSale: document.getElementById("f-onsale").checked,
      params: params,
      skus: [{
        specName: document.getElementById("f-spec").value.trim() || "默认规格",
        price: Math.round(Number(priceYuan) * 100),
        image: null,
        sort: 0,
        enabled: document.getElementById("f-enabled").checked
      }]
    };

    saving = true;
    [document.getElementById("save"), document.getElementById("save2")].forEach(function (b) { if (b) b.disabled = true; });
    var request = editId ? Api.put("/v1/admin/products/" + editId, body) : Api.post("/v1/admin/products", body);
    request.then(function () {
      toast("保存成功，商品索引同步任务已投递", "ok");
      setTimeout(function () { location.href = "products.html"; }, 700);
    }, function (error) {
      saving = false;
      [document.getElementById("save"), document.getElementById("save2")].forEach(function (b) { if (b) b.disabled = false; });
      showError(error);
    });
  }

  Promise.all([
    Api.get("/v1/admin/categories"),
    Api.get("/v1/admin/brands?page=1&size=100", { silent: true })
      .then(function (page) { return page.list || []; }, function () { return []; }),
    Api.get("/v1/admin/params/templates", { silent: true }).then(function (list) { return list || []; }, function () { return []; }),
    editId ? Api.get("/v1/admin/products/" + editId) : Promise.resolve(null)
  ]).then(function (res) {
    tree = res[0] || [];
    categories = flatten(tree, []);
    brands = res[1];
    templates = res[2].filter(function (t) { return t.enabled !== false; });
    product = res[3];
    renderForm();
  }, showError);
}
</script>
</body>
</html>
