<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品管理 · 百益后台</title>
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="assets/admin-shell.js"></script>
<script>
if (adminShell("products", { title: "商品管理", crumb: "商品", perm: "product:read" })) {
  var canWrite = hasPerm("product:write");
  var filters = { keyword: "", categoryId: "", brandId: "", status: "" };
  var page = 1, SIZE = 10, total = 0, rows = [];
  var brandOptions = [], categoryOptions = [];

  function flatten(nodes, out) {
    (nodes || []).forEach(function (n) {
      out.push({ id: n.id, name: n.name, level: n.level });
      flatten(n.children, out);
    });
    return out;
  }

  function optionList(list, selected) {
    return list.map(function (x) {
      var indent = new Array(x.level || 1).join("　");
      return "<option value=\"" + x.id + "\"" + (String(x.id) === String(selected) ? " selected" : "") + ">" + indent + esc(x.name) + "</option>";
    }).join("");
  }

  function load() {
    var query = ["page=" + page, "size=" + SIZE];
    if (filters.keyword) query.push("keyword=" + encodeURIComponent(filters.keyword));
    if (filters.categoryId) query.push("categoryId=" + filters.categoryId);
    if (filters.brandId) query.push("brandId=" + filters.brandId);
    if (filters.status) query.push("status=" + filters.status);
    Api.get("/v1/admin/products?" + query.join("&")).then(function (data) {
      rows = data.list || [];
      total = data.total || 0;
      renderRows();
      renderPager();
    }, showError);
  }

  function renderRows() {
    document.getElementById("list").innerHTML = rows.length ? rows.map(function (p) {
      var on = p.status === "ON_SALE";
      var actions = "<a class=\"btn btn-sm\" href=\"product-edit.html?id=" + p.id + "\">编辑</a>";
      if (canWrite) {
        actions += "<button class=\"btn btn-sm\" data-toggle=\"" + p.id + "\">" + (on ? "下架" : "上架") + "</button>"
          + "<button class=\"btn btn-sm\" data-del=\"" + p.id + "\">删除</button>";
      }
      return "<tr><td><div class=\"cell-main\"><img class=\"thumb\" src=\"" + img(p.mainImage, "tee-01") + "\" alt=\"\">"
        + "<span>" + esc(p.name) + "<br><span class=\"small faint\">商品 ID " + p.id + "</span></span></div></td>"
        + "<td class=\"small muted\">" + esc(p.categoryName || "—") + "</td><td>" + esc(p.brandName || "—") + "</td>"
        + "<td class=\"num price\">" + yuanPlain(p.minPrice) + "</td>"
        + "<td class=\"num\">" + (p.sales || 0) + "</td>"
        + "<td>" + (on ? "<span class=\"pill pill-done\">已上架</span>" : "<span class=\"pill pill-cancel\">已下架</span>") + "</td>"
        + "<td><div class=\"table-actions\">" + actions + "</div></td></tr>";
    }).join("") : "<tr><td colspan=\"7\"><div class=\"empty\"><i data-icon=\"layout-grid\" data-size=\"34\"></i><h4>没有符合条件的商品</h4></div></td></tr>";
    document.getElementById("total").textContent = "共 " + total + " 个商品";
    mountIcons(document.getElementById("content"));

    document.querySelectorAll("[data-toggle]").forEach(function (b) {
      b.onclick = function () {
        var p = rows.filter(function (x) { return x.id === Number(b.dataset.toggle); })[0];
        var on = p.status === "ON_SALE";
        Api.put("/v1/admin/products/" + p.id + (on ? "/off-sale" : "/on-sale")).then(function () {
          toast(on ? "已下架，前台不可见" : "已上架，前台可见", "ok");
          load();
        }, showError);
      };
    });
    document.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () {
        var p = rows.filter(function (x) { return x.id === Number(b.dataset.del); })[0];
        openModal("<p>确定删除商品「" + esc(p.name) + "」？</p><div class=\"alert alert-plain mt12\"><i data-icon=\"info\" data-size=\"15\"></i>删除为逻辑删除（deleted = 1），与下架语义分离；历史订单仍会展示商品快照。</div>",
          { title: "删除商品", footer: "<button class=\"btn\" data-close>取消</button><button class=\"btn btn-price\" id=\"okDel\">确认删除</button>" });
        document.getElementById("okDel").onclick = function () {
          closeModal();
          Api.del("/v1/admin/products/" + p.id).then(function () { toast("已删除（逻辑删除）", "ok"); load(); }, showError);
        };
      };
    });
  }

  function renderPager() {
    var pageCount = Math.max(1, Math.ceil(total / SIZE));
    var el = document.getElementById("pager");
    if (pageCount <= 1) { el.innerHTML = ""; return; }
    el.innerHTML = "<button " + (page === 1 ? "disabled" : "") + " data-p=\"" + (page - 1) + "\">上一页</button>"
      + "<span class=\"small muted\">第 " + page + " / " + pageCount + " 页</span>"
      + "<button " + (page === pageCount ? "disabled" : "") + " data-p=\"" + (page + 1) + "\">下一页</button>";
    el.querySelectorAll("[data-p]").forEach(function (b) {
      b.onclick = function () { page = Number(b.dataset.p); load(); };
    });
  }

  document.getElementById("content").innerHTML =
    "<div class=\"panel\"><div class=\"panel-head\"><h3><i data-icon=\"layout-grid\" data-size=\"16\"></i>商品列表</h3>"
    + "<div class=\"inline\"><span class=\"small faint\" id=\"total\"></span>"
    + (canWrite ? "<a class=\"btn btn-primary btn-sm\" href=\"product-edit.html\"><i data-icon=\"plus\" data-size=\"14\"></i>新增商品</a>" : "")
    + "</div></div>"
    + "<div class=\"panel-body\"><div class=\"toolbar\">"
    + "<input class=\"input\" id=\"kw\" placeholder=\"商品名称\">"
    + "<select class=\"select\" id=\"cat\"><option value=\"\">全部分类</option></select>"
    + "<select class=\"select\" id=\"brand\"><option value=\"\">全部品牌</option></select>"
    + "<select class=\"select\" id=\"status\"><option value=\"\">全部状态</option><option value=\"ON_SALE\">已上架</option><option value=\"OFF_SALE\">已下架</option></select>"
    + "<button class=\"btn\" id=\"search\"><i data-icon=\"search\" data-size=\"15\"></i>查询</button>"
    + "<button class=\"btn btn-ghost\" id=\"reset\">重置</button></div>"
    + "<div class=\"table-wrap\"><table class=\"table\"><thead><tr><th>商品</th><th>分类</th><th>品牌</th><th class=\"num\">最低价</th><th class=\"num\">销量</th><th>状态</th><th>操作</th></tr></thead><tbody id=\"list\"></tbody></table></div>"
    + "<div class=\"pagination\" id=\"pager\"></div></div></div>";

  document.getElementById("search").onclick = function () {
    filters.keyword = document.getElementById("kw").value.trim();
    filters.categoryId = document.getElementById("cat").value;
    filters.brandId = document.getElementById("brand").value;
    filters.status = document.getElementById("status").value;
    page = 1;
    load();
  };
  document.getElementById("reset").onclick = function () {
    filters = { keyword: "", categoryId: "", brandId: "", status: "" };
    document.getElementById("kw").value = "";
    document.getElementById("cat").value = "";
    document.getElementById("brand").value = "";
    document.getElementById("status").value = "";
    page = 1;
    load();
  };
  document.getElementById("kw").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") document.getElementById("search").click();
  });
  mountIcons(document.getElementById("content"));

  Promise.all([
    Api.get("/v1/admin/categories", { silent: true }).then(function (tree) { return flatten(tree, []); }, function () { return []; }),
    Api.get("/v1/brands", { silent: true }).then(function (list) { return list || []; }, function () { return []; })
  ]).then(function (res) {
    categoryOptions = res[0];
    brandOptions = res[1];
    document.getElementById("cat").innerHTML = "<option value=\"\">全部分类</option>" + optionList(categoryOptions);
    document.getElementById("brand").innerHTML = "<option value=\"\">全部品牌</option>" + optionList(brandOptions);
    load();
  });
}
</script>
</body>
</html>
