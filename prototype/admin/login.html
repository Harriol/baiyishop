<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 百益后台</title>
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>
<main class="container" style="max-width:420px">
<div class="card mt24">
  <div class="center" style="flex-direction:column;gap:6px;padding:6px 0 16px">
    <div class="logo-mark" style="width:40px;height:40px;font-size:20px;border-radius:8px">益</div>
    <h2 style="font-size:17px">百益商城 · 运营后台</h2>
    <p class="small faint">后台账号与前台用户相互隔离，角色由账号自身决定</p>
  </div>
  <div class="form-grid">
    <div class="field"><label>账号</label><input class="input" id="u" placeholder="后台账号" autocomplete="username"></div>
    <div class="field"><label>密码</label><input class="input" id="p" type="password" placeholder="登录密码" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-lg btn-block" id="login">登录后台</button>
  </div>
  <div class="alert alert-plain mt16"><i data-icon="info" data-size="15"></i>
  联调账号：超级管理员 <b>smokeadmin / Admin@2026</b>；客服（仅查单与备注）<b>check_service / Admin@2026</b>。</div>
</div>
</main>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
function nextUrl() {
  var next = qs("next", "index.html");
  // 只允许同目录内的相对页面，避免开放重定向
  return /^[\w.-]+\.html(\?.*)?$/.test(next) ? next : "index.html";
}

if (Api.isLoggedIn()) {
  location.replace(nextUrl());
}

function login() {
  var username = document.getElementById("u").value.trim();
  var password = document.getElementById("p").value;
  if (!username) { toast("请输入账号", "err"); return; }
  if (!password) { toast("请输入密码", "err"); return; }
  var button = document.getElementById("login");
  button.disabled = true;
  button.textContent = "登录中…";
  Api.adminLogin(username, password).then(function (data) {
    toast("欢迎回来，" + ((data.admin && (data.admin.realName || data.admin.username)) || username), "ok");
    setTimeout(function () { location.href = nextUrl(); }, 400);
  }, function (error) {
    button.disabled = false;
    button.textContent = "登录后台";
    showError(error);
  });
}

document.getElementById("login").onclick = login;
document.getElementById("p").addEventListener("keydown", function (ev) {
  if (ev.key === "Enter") login();
});
mountIcons(document);
</script>
</body>
</html>
