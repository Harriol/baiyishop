# 百益商城 · 依赖版本目录（单一版本来源）
# 依据 docs/adr/ADR-006 与 docs/architecture.md 10.1：所有依赖版本集中在此锁定。
# 版本取值均已对照 Maven Central 实际可用版本核实（2026-09-28）。

[versions]
spring-boot = "4.1.1"
spring-cloud = "2025.1.3"
spring-cloud-alibaba = "2025.1.0.0"
mybatis-plus = "3.5.17"
seata = "2.0.0"
rocketmq-spring = "2.3.6"
jjwt = "0.12.7"
# ES 客户端必须与服务器同版本：Boot 4 默认管理 9.x 客户端，
# 而 9.x 客户端发的 compatible-with=9 头会被 8.11.3 服务器拒绝（400），
# 故自行锁定为与 deploy 中 ES 服务器一致的 8.11.3。
elasticsearch-client = "8.11.3"
# 覆盖率工具（NFR：核心模块 ≥80%）
jacoco = "0.8.13"

[libraries]
# --- Spring Cloud / Alibaba（BOM） ---
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-alibaba-bom = { module = "com.alibaba.cloud:spring-cloud-alibaba-dependencies", version.ref = "spring-cloud-alibaba" }

# --- Spring Boot starters（版本由 Boot BOM 管理，此处不写版本） ---
boot-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
boot-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
# 注意：Boot 4 的 spring-boot-starter-webmvc 不再自带 Jackson，需要单独引入本 starter
boot-starter-json = { module = "org.springframework.boot:spring-boot-starter-json" }
boot-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
boot-test = { module = "org.springframework.boot:spring-boot-starter-test" }
lombok = { module = "org.projectlombok:lombok" }

# --- 检索 ---
elasticsearch-java = { module = "co.elastic.clients:elasticsearch-java", version.ref = "elasticsearch-client" }

# --- 服务发现与治理 ---
nacos-discovery = { module = "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery" }
nacos-config = { module = "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config" }
sentinel = { module = "com.alibaba.cloud:spring-cloud-starter-alibaba-sentinel" }
loadbalancer = { module = "org.springframework.cloud:spring-cloud-starter-loadbalancer" }
openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }
gateway-webflux = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }

# --- 数据库迁移 ---
# 注意：Spring Boot 4 把自动装配拆成了按技术分模块的 jar，
# 只加 flyway-core 不会触发迁移，必须用 starter（它才带 spring-boot-flyway）
boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }

# --- 持久层 ---
mybatis-plus-spring-boot4-starter = { module = "com.baomidou:mybatis-plus-spring-boot4-starter", version.ref = "mybatis-plus" }
mybatis-plus-jsqlparser = { module = "com.baomidou:mybatis-plus-jsqlparser", version.ref = "mybatis-plus" }

# --- 分布式事务与消息 ---
seata-spring-boot-starter = { module = "io.seata:seata-spring-boot-starter", version.ref = "seata" }
rocketmq-spring-boot-starter = { module = "org.apache.rocketmq:rocketmq-spring-boot-starter", version.ref = "rocketmq-spring" }

# --- 安全 ---
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
