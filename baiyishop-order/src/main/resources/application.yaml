server:
  port: 8085

spring:
  application:
    name: baiyishop-order
  profiles:
    # 本地数据库口令等敏感配置放在 application-local.yaml（已被 .gitignore 忽略）
    default: local
  config:
    import: optional:classpath:application-local.yaml
  threads:
    virtual:
      enabled: true
  cloud:
    nacos:
      # 注册中心地址；可用环境变量覆盖（容器内运行时指向 nacos 服务名）
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 本地开发使用 public 命名空间；不同环境用 namespace 隔离
        namespace: ${NACOS_NAMESPACE:}

  # 数据源：本服务只连自己的 schema（docs/adr/ADR-007），账号无跨库权限
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:baiyishop_order}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:baiyi_order}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: baiyishop-order-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  # 表结构由 Flyway 管理，禁止手工改表（docs/database.md 1.6）
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# RocketMQ：下单后的延时取消与发货后的自动收货（docs/architecture.md 5.3）
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: baiyishop-order

baiyishop:
  order:
    # 单品限购数量（购物车累加与下单数量都受它约束，REQ-601）
    max-quantity-per-sku: 99
    # 未支付自动取消时长（REQ-704）
    pay-timeout: 15m
    # 发货后自动确认收货时长（REQ-707）
    auto-receive-after: 7d
    # 延时消息丢失时的兜底扫描间隔（默认 1 分钟，保证「15 分钟未支付」的精度）
    timeout-scan-delay: 1m
    outbox-max-retry: 10
    order-timeout-topic: baiyishop-order-timeout
    order-auto-receive-topic: baiyishop-order-auto-receive
    # 支付成功事件（payment-service 生产，本服务消费，REQ-802）
    payment-success-topic: baiyishop-payment-success

# 分布式事务（ADR-002、docs/architecture.md 6.1）
seata:
  enabled: true
  application-id: baiyishop-order
  tx-service-group: baiyishop_tx_group
  registry:
    # 本地开发用 grouplist 直连 TC：Docker Desktop 下容器 IP 宿主机不可达，
    # 而 TC 注册到 Nacos 的是容器 IP。部署到同一 bridge 网络时改成 nacos 即可（见 deploy/README.md）
    type: ${SEATA_REGISTRY_TYPE:file}
    nacos:
      application: seata-server
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      group: SEATA_GROUP
      namespace: ""
  service:
    vgroup-mapping:
      baiyishop_tx_group: default
    grouplist:
      default: ${SEATA_TC_ADDR:127.0.0.1:8091}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 统一日志格式：时间 | 级别 | 服务名 | 线程 | traceId | 类 | 消息（REQ-1003、NFR-04）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name:}] [%thread] [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    root: info
