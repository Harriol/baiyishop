# 百益商城 · RocketMQ Broker 配置（本地开发）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 开发期自动创建 Topic，便于本地联调（生产需关闭并显式建 Topic）
autoCreateTopicEnable = true

# 应用在宿主机运行、Broker 在容器内，因此对外注册宿主机地址
brokerIP1 = 127.0.0.1
namesrvAddr = baiyishop-rocketmq-namesrv:9876
